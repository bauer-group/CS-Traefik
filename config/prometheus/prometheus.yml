# =============================================================================
# Prometheus - Scrape Configuration
# =============================================================================
# Reference: https://prometheus.io/docs/prometheus/latest/configuration/configuration/
# =============================================================================

global:
  scrape_interval:     15s   # default for all jobs unless overridden
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    stack: edgeproxy
    monitor: cs-traefik

# -----------------------------------------------------------------------------
# Alerting
# -----------------------------------------------------------------------------
# Alertmanager runs with `--web.route-prefix=/alertmanager` (set in
# docker-compose.monitoring.yml), so the alerts API lives at
# /alertmanager/api/v2/alerts -- NOT at the root. Without
# `path_prefix:` Prometheus posts to the root and gets 404, alerts
# never reach Alertmanager (failure mode visible only in Prometheus's
# notifier logs: "Error sending alerts ... bad response status 404").
alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets:
            - alertmanager:9093

# Rules files (relative to /etc/prometheus inside the container)
rule_files:
  - "alerts.yml"

# -----------------------------------------------------------------------------
# Scrape configs
# -----------------------------------------------------------------------------
# All targets resolve via Docker DNS on the proxy-internal network.
# Container hostname == service name in compose.
scrape_configs:

  # Prometheus scrapes itself.
  # `--web.route-prefix=/prometheus` (set in docker-compose.monitoring.yml)
  # serves ALL endpoints under /prometheus -- including /metrics. Without
  # the explicit metrics_path the scrape would 404. Container-DNS
  # `prometheus` (not `localhost`) keeps the scrape consistent with the
  # rest of the stack and works under IPv6-only deployments too.
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: prometheus

  # Traefik metrics endpoint (entryPoints.metrics in traefik.yml).
  # Container-port 8082 -- the port used in the upstream Traefik
  # documentation examples for the metrics entrypoint. Internal-only,
  # never exposed to the host.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
        labels:
          service: traefik

  # Host-level metrics (CPU, memory, disk, network, ...)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  # Container-level metrics (per-container CPU/memory/network/IO)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # Loki self-metrics
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  # Grafana self-metrics.
  # `GF_SERVER_SERVE_FROM_SUB_PATH=true` + `GF_SERVER_ROOT_URL=.../grafana`
  # (in docker-compose.monitoring.yml) move ALL endpoints under /grafana,
  # including /metrics. Without metrics_path the scrape returns 404.
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

  # Alertmanager self-metrics.
  # `--web.route-prefix=/alertmanager` (in docker-compose.monitoring.yml)
  # serves ALL endpoints under /alertmanager, including /metrics.
  - job_name: alertmanager
    metrics_path: /alertmanager/metrics
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
