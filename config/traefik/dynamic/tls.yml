# =============================================================================
# Traefik v3 - TLS Options and Manual Certificates
# =============================================================================
# Two unrelated concerns in one file:
#   1. TLS options -- cipher suites, min version, mTLS for routers
#   2. Manual certificates -- bring-your-own-cert files in config/certs/static
#
# Routers select a TLS option set via labels:
#   traefik.http.routers.foo.tls.options=modern@file
# (without explicit selection, the `default` block applies)
# =============================================================================

tls:

  # ---------------------------------------------------------------------------
  # TLS options
  # ---------------------------------------------------------------------------
  # Reference: https://doc.traefik.io/traefik/https/tls/#tls-options
  options:

    # ---- DEFAULT (compatibility-first; applied to every router that
    # doesn't override tls.options).
    #
    # Permissive on purpose: BAUER GROUP serves users in regions where
    # legacy browsers and feature phones (Android <5, KaiOS, older
    # WebViews) are still common. We accept TLS 1.1 to keep them online.
    # TLS 1.0 is intentionally NOT enabled (POODLE / BEAST / SWEET32
    # mitigations are too poor at that level).
    #
    # Apps that need stricter TLS (admin surfaces, payment endpoints,
    # PCI-DSS workloads) explicitly opt into the `modern` block below.
    default:
      minVersion: VersionTLS11
      sniStrict: false
      cipherSuites:
        # TLS 1.3 ciphers are negotiated automatically and not listed.
        # TLS 1.2 -- modern AEAD ciphers
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        # TLS 1.2 -- legacy CBC ciphers (still required by older Android,
        # iOS 9, IE on Win7). Removed if you only target modern browsers.
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
        # TLS 1.2 -- RSA key-exchange (no PFS) -- last-resort for
        # very-old clients. Drop these in production if compliance
        # requires PFS-only.
        - TLS_RSA_WITH_AES_128_GCM_SHA256
        - TLS_RSA_WITH_AES_256_GCM_SHA384
        - TLS_RSA_WITH_AES_128_CBC_SHA
        - TLS_RSA_WITH_AES_256_CBC_SHA
      curvePreferences:
        - X25519
        - secp521r1
        - secp384r1
        - secp256r1
      alpnProtocols:
        - h2
        - http/1.1


    # ---- MODERN -- TLS 1.3 only, no legacy clients.
    # Use for admin surfaces and high-sensitivity routers via:
    #   traefik.http.routers.<name>.tls.options=modern@file
    modern:
      minVersion: VersionTLS13
      sniStrict: true
      curvePreferences:
        - X25519
        - secp384r1
      alpnProtocols:
        - h2
        - http/1.1


    # ---- INTERMEDIATE -- TLS 1.2 minimum, modern AEAD only.
    # Mozilla "Intermediate" recipe -- excludes very-old clients
    # but keeps all common 2018+ browsers / iOS 11+ / Android 5+.
    intermediate:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519
        - secp521r1
        - secp384r1
        - secp256r1
      alpnProtocols:
        - h2
        - http/1.1


    # ---- mTLS example (commented out) ---------------------------------------
    # Use for backend-only routers that should only be reachable by clients
    # holding a certificate signed by your private CA. Drop the CA bundle
    # into config/certs/static/ca.pem and uncomment.
    #
    # mtls:
    #   minVersion: VersionTLS12
    #   clientAuth:
    #     caFiles:
    #       - /etc/traefik/certs/static/ca.pem
    #     clientAuthType: RequireAndVerifyClientCert


  # ---------------------------------------------------------------------------
  # Manual certificates (bring-your-own)
  # ---------------------------------------------------------------------------
  # Drop your *.crt + *.key files into config/certs/static/, then list each
  # pair below. Traefik picks the right cert per host based on the SNI in
  # the TLS handshake (matches the cert's SAN / CN).
  #
  # Use cases:
  #   - Wildcard certs from a corporate CA (e.g. *.bauer-group.com)
  #   - EV / OV certs purchased from a commercial CA
  #   - Internal-only domains where Let's Encrypt doesn't apply
  #
  # When at least one entry is uncommented below, the matching SNIs use
  # the manual cert; everything else falls back to Let's Encrypt
  # (per the certResolver configured on the router / entrypoint).
  #
  # Example (uncomment + adjust):
  # certificates:
  #   - certFile: /etc/traefik/certs/static/wildcard.bauer-group.com.crt
  #     keyFile:  /etc/traefik/certs/static/wildcard.bauer-group.com.key
  #     stores:
  #       - default
  #
  #   - certFile: /etc/traefik/certs/static/customer.example.com.crt
  #     keyFile:  /etc/traefik/certs/static/customer.example.com.key
  #     stores:
  #       - default

  certificates: []


  # ---------------------------------------------------------------------------
  # Default certificate (TLS handshake fallback)
  # ---------------------------------------------------------------------------
  # Cert returned to clients connecting with an unknown SNI (or no SNI at
  # all -- common from misconfigured probes / port scanners). Without an
  # explicit default, Traefik returns its built-in TRAEFIK DEFAULT CERT
  # which scares any TLS scanner. Provide a self-signed bind cert here
  # for cleaner reports.
  #
  # stores:
  #   default:
  #     defaultCertificate:
  #       certFile: /etc/traefik/certs/static/default.crt
  #       keyFile:  /etc/traefik/certs/static/default.key
