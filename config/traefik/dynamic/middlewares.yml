# =============================================================================
# Traefik v3 - Dynamic Middlewares (file provider)
# =============================================================================
# Reusable middlewares. Reference from container labels with the `@file`
# suffix:  traefik.http.routers.foo.middlewares=hsts@file
#
# Design philosophy:
#
#   The reverse proxy is NOT the right place to enforce app-level policy.
#   HSTS, Content-Security-Policy, Permissions-Policy, frame-deny, and
#   rate-limits all have semantics that depend on the SPECIFIC app -- a
#   payment flow needs different headers than a static-asset CDN needs
#   different headers than an SSE-streaming dashboard needs different
#   headers than an OAuth-redirect endpoint.
#
#   So this file ships ATOMIC, OPT-IN middlewares. Apps pick what they
#   need; the proxy applies nothing globally to app traffic except the
#   BAUER GROUP `bg-provider` identification header (wired at the
#   entrypoint level in traefik.yml, ALWAYS-ON, not opt-out-able).
#
# Middlewares specific to the admin entrypoint (BasicAuth, IP whitelist,
# strict rate-limit) are defined as labels on the traefik service in
# docker-compose.yml -- their values come from .env.
#
# For full documentation see docs/middlewares.md.
# =============================================================================

http:

  middlewares:

    # =========================================================================
    # ALWAYS-ON  (entrypoint-level in traefik.yml)
    # =========================================================================

    # -------------------------------------------------------------------------
    # bg-provider -- BAUER GROUP identification (response only)
    # -------------------------------------------------------------------------
    # Wired into entryPoints.web.http.middlewares + entryPoints.web-secure.
    # http.middlewares in traefik.yml. Runs on EVERY public response,
    # before any router-level middleware. Apps cannot opt out.
    #
    # Response-header only -- the request flow is client -> proxy ->
    # backend, so adding X-Solution-Provider on the REQUEST side would
    # tell the BACKEND about the proxy (pointless; the backend is
    # already in our control). The point is to mark traffic LEAVING
    # the proxy back to the client as "this came through a BG-managed
    # edge" -- pure response-side concern. Compliance / branding
    # requirement, not a security boundary.
    bg-provider:
      headers:
        customResponseHeaders:
          X-Solution-Provider: "BAUER GROUP"


    # =========================================================================
    # SECURITY HEADERS  (opt-in per router)
    # =========================================================================

    # -------------------------------------------------------------------------
    # HSTS -- HTTP Strict Transport Security
    # -------------------------------------------------------------------------
    # 2 years, all subdomains, preload-eligible. Only enable preload after
    # the domain is on the HSTS preload list. Apps with mixed-content
    # legacy clients should NOT use this.
    hsts:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: false
        forceSTSHeader: true

    # Looser HSTS (1 year, no subdomain inheritance, no preload) -- safer
    # default for apps that share a parent domain with non-HTTPS siblings.
    hsts-mild:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        stsPreload: false
        forceSTSHeader: true


    # -------------------------------------------------------------------------
    # Frame-deny / clickjacking protection
    # -------------------------------------------------------------------------
    # Sets X-Frame-Options: DENY. For SAMEORIGIN, define your own.
    frame-deny:
      headers:
        frameDeny: true

    # SAMEORIGIN variant for apps that legitimately use same-origin iframes.
    frame-sameorigin:
      headers:
        customResponseHeaders:
          X-Frame-Options: "SAMEORIGIN"


    # -------------------------------------------------------------------------
    # Content-type sniff protection
    # -------------------------------------------------------------------------
    nosniff:
      headers:
        contentTypeNosniff: true


    # -------------------------------------------------------------------------
    # Referrer-Policy
    # -------------------------------------------------------------------------
    referrer-strict:
      headers:
        referrerPolicy: "strict-origin-when-cross-origin"

    referrer-noreferrer:
      headers:
        referrerPolicy: "no-referrer"


    # -------------------------------------------------------------------------
    # Permissions-Policy (browser feature gating)
    # -------------------------------------------------------------------------
    # Denies powerful APIs. Apps that LEGITIMATELY use camera / mic / etc.
    # must NOT use this -- define a per-app policy instead.
    permissions-deny:
      headers:
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"


    # -------------------------------------------------------------------------
    # Server-header scrubbing
    # -------------------------------------------------------------------------
    # Strips the upstream `Server` and `X-Powered-By` response headers --
    # mild obscurity hardening.
    server-scrub:
      headers:
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""


    # =========================================================================
    # CORS  (Cross-Origin Resource Sharing)
    # =========================================================================
    # CORS is browser-enforced policy. Servers signal allowed origins via
    # response headers; browsers enforce on cross-origin XHR / fetch / WS.
    # Public APIs / fonts / static assets often need permissive CORS;
    # session-bearing apps need carefully-scoped CORS.

    # -------------------------------------------------------------------------
    # CORS -- permissive (allow all origins, no credentials)
    # -------------------------------------------------------------------------
    # OK for: public read-only APIs, font CDNs, static asset hosts.
    # NOT OK for: anything where the response carries cookies / auth.
    # CORS spec forbids `*` origin with `Access-Control-Allow-Credentials:
    # true` -- browsers reject the response.
    cors-permissive:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - HEAD
        accessControlAllowHeaders:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true

    # -------------------------------------------------------------------------
    # CORS -- credentials (TEMPLATE -- override per-app)
    # -------------------------------------------------------------------------
    # Replace the origin list with your specific origins. CORS WITH
    # credentials forbids wildcard origins.
    cors-credentials:
      headers:
        accessControlAllowOriginList:
          - "https://app.example.com"
          - "https://admin.example.com"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
        addVaryHeader: true


    # =========================================================================
    # RATE LIMITING
    # =========================================================================

    # -------------------------------------------------------------------------
    # Rate limiting -- baseline (per source IP)
    # -------------------------------------------------------------------------
    # 5000 req/s average / 10000 burst is sized for CGNAT (Carrier-Grade
    # NAT) reality: mobile carriers, dual-stack-lite ISPs, and corporate
    # egress networks share a single IPv4 across hundreds-to-thousands
    # of subscribers. A modest mobile cell tower load (5000 users each
    # loading a 50-asset page) easily produces 250k burst requests from
    # a single apparent source IP. The 1000 req/s "tutorial default"
    # would rate-limit those legitimate users into a 503 storm.
    #
    # The trade-off: a single-attacker flood from one residential IP can
    # produce ~10000 small req/s (limited by their upstream link), so
    # this still bounds the single-IP attack vector. Distributed floods
    # (botnet) need anti-DDoS at the provider / CDN level, not here.
    rate-limit:
      rateLimit:
        average: 5000
        burst: 10000
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1            # trust first proxy (Traefik itself)
            ipv6Subnet: 64      # aggregate IPv6 to /64 (one customer)


    # -------------------------------------------------------------------------
    # Rate limiting -- permissive (heavy-CGNAT, S3 multipart, file uploads)
    # -------------------------------------------------------------------------
    # For apps targeting markets with extreme CGNAT consolidation, or
    # endpoints where a single client legitimately sends many concurrent
    # requests (S3 multipart uploads with high `max_concurrency`).
    rate-limit-permissive:
      rateLimit:
        average: 20000
        burst: 40000
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1
            ipv6Subnet: 64


    # -------------------------------------------------------------------------
    # Rate limiting -- strict (admin / login / brute-force-prone surfaces)
    # -------------------------------------------------------------------------
    # 10 req/s average / 20 burst is fine HERE because admin surfaces
    # in this stack are gated by IP whitelist FIRST -- only trusted
    # source IPs (office / VPN / static personal) reach the rate limiter.
    # Do NOT apply `rate-limit-strict` to a router that lacks an IP
    # whitelist -- legitimate CGNAT users would see 503s.
    rate-limit-strict:
      rateLimit:
        average: 10
        burst: 20
        period: 1s


    # =========================================================================
    # BODY SIZE LIMITS  (buffering middleware = OPT-IN -- streaming is default)
    # =========================================================================
    # WARNING: applying ANY of these middlewares enables Traefik's buffering
    # behaviour for that route. Without these middlewares, Traefik streams
    # request and response bodies directly without buffering -- which is
    # what you want for S3, MinIO, large uploads, SSE, video streams etc.
    #
    # Use these ONLY on routes where you want to ENFORCE a size cap (e.g.
    # public APIs that should reject 10 GB nonsense uploads). Apply at
    # the SPECIFIC router that needs the cap, NOT globally.

    # 1 MB cap -- typical small-API / form-submission limit.
    body-limit-1mb:
      buffering:
        maxRequestBodyBytes: 1048576
        maxResponseBodyBytes: 1048576

    # 10 MB cap -- larger API payloads, JSON imports.
    body-limit-10mb:
      buffering:
        maxRequestBodyBytes: 10485760
        maxResponseBodyBytes: 10485760

    # 100 MB cap -- generous, but still bounded.
    body-limit-100mb:
      buffering:
        maxRequestBodyBytes: 104857600
        maxResponseBodyBytes: 104857600


    # =========================================================================
    # RESILIENCE  (retry + circuit breaker)
    # =========================================================================

    # -------------------------------------------------------------------------
    # Retry -- transparent retry on transient failures
    # -------------------------------------------------------------------------
    # Retries up to 3 times with exponential backoff (100ms initial, 1s cap).
    # Only retries IDEMPOTENT methods (GET / HEAD / OPTIONS / PUT / DELETE)
    # by default -- non-idempotent (POST / PATCH) is NEVER retried because
    # the request might have side-effects.
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # More aggressive retry for read-heavy APIs / static asset proxies.
    retry-aggressive:
      retry:
        attempts: 5
        initialInterval: 50ms


    # -------------------------------------------------------------------------
    # Circuit breaker -- fail-fast when backends misbehave
    # -------------------------------------------------------------------------
    # Trips the breaker when more than 30% of recent requests return 5xx
    # (within the last 10 seconds). Once tripped, returns 503 immediately
    # for all requests for the recovery window, then half-opens to test.
    # Protects backends from being hammered when they're already failing.
    circuit-breaker:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.30"
        checkPeriod: 10s
        fallbackDuration: 10s
        recoveryDuration: 10s

    # Stricter variant -- trips at 10% errors.
    circuit-breaker-strict:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.10"
        checkPeriod: 10s
        fallbackDuration: 30s
        recoveryDuration: 30s


    # =========================================================================
    # DOMAIN CANONICALIZATION  (www / non-www)
    # =========================================================================

    # -------------------------------------------------------------------------
    # Strip `www.` from the host (redirect www.example.com -> example.com)
    # -------------------------------------------------------------------------
    # Apply on a router that matches `Host(\`www.example.com\`)`.
    redirect-strip-www:
      redirectRegex:
        regex: "^https?://www\\.(.+)"
        replacement: "https://$1"
        permanent: true

    # -------------------------------------------------------------------------
    # Add `www.` to the host (redirect example.com -> www.example.com)
    # -------------------------------------------------------------------------
    # Apply on a router that matches `Host(\`example.com\`)` (the bare host).
    redirect-add-www:
      redirectRegex:
        regex: "^https?://(?:www\\.)?(.+)"
        replacement: "https://www.$1"
        permanent: true


    # =========================================================================
    # FORWARD AUTH  (SSO via Authelia / Authentik / Vouch / oauth2-proxy)
    # =========================================================================
    # Forward-auth delegates authentication to an external service. Traefik
    # makes a sub-request to the auth service for each incoming request;
    # if the auth service returns 200, the request is forwarded to the
    # backend. If 401, the user is redirected to the auth service's login.
    #
    # These templates assume Authelia / Authentik are running on the
    # internal proxy network with hostnames `authelia` / `authentik`.
    # Adjust addresses / trustForwardHeader / authResponseHeaders to match
    # your specific deployment. Reference these on app routers:
    #   traefik.http.routers.myapp.middlewares=forward-auth-authelia@file

    # -------------------------------------------------------------------------
    # Authelia -- https://www.authelia.com/
    # -------------------------------------------------------------------------
    forward-auth-authelia:
      forwardAuth:
        address: "http://authelia:9091/api/verify?rd=https://auth.example.com"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

    # -------------------------------------------------------------------------
    # Authentik -- https://goauthentik.io/
    # -------------------------------------------------------------------------
    forward-auth-authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid


    # =========================================================================
    # PATH MANIPULATION
    # =========================================================================

    # -------------------------------------------------------------------------
    # Strip a single path prefix
    # -------------------------------------------------------------------------
    # Useful when routing /api/* on the public side to a backend that
    # expects requests at /. Reference + override per-router:
    #   traefik.http.middlewares.my-strip.stripprefix.prefixes=/api
    # The example below strips /api -- copy + adjust per route.
    strip-prefix-api:
      stripPrefix:
        prefixes:
          - /api


    # =========================================================================
    # COMPRESSION
    # =========================================================================
    # Safe to apply broadly. Honours Accept-Encoding from the client and
    # excludes types that must not be compressed (Server-Sent Events,
    # already-compressed media).
    #
    # `minResponseBodyBytes: 50` sits at the technical minimum below
    # which compression actively HURTS:
    #   * gzip header overhead is 10-18 bytes -- compressed output below
    #     ~48 bytes is larger than the original.
    #   * Brotli / Zstandard headers are ~14-20 bytes -- minimum useful
    #     compressed size is ~50 bytes.
    # Traefik's compress middleware uses ONE threshold for all
    # encodings, so 50 is the safe choice across gzip / Brotli / zstd.
    # Smaller responses (tiny error messages, status-only responses)
    # pass through uncompressed -- prevents the bizarre case where a
    # 30-byte response becomes 50 bytes after "compression".
    #
    # Excluded content types: SSE (must not be buffered), and types
    # that are already compressed (re-compression burns CPU for zero
    # gain).
    compression:
      compress:
        excludedContentTypes:
          - text/event-stream
          - image/jpeg
          - image/png
          - image/webp
          - image/avif
          - image/gif
          - video/mp4
          - video/webm
          - audio/mpeg
          - audio/ogg
          - application/zip
          - application/gzip
          - application/x-bzip2
          - application/x-7z-compressed
          - application/x-rar-compressed
          - application/x-tar
        minResponseBodyBytes: 50


    # =========================================================================
    # AUTH HELPERS
    # =========================================================================

    # -------------------------------------------------------------------------
    # Strip the Authorization header before forwarding to backends
    # -------------------------------------------------------------------------
    # Useful when BasicAuth is used at the edge but the upstream service
    # doesn't expect (and might mishandle) an Authorization header.
    strip-auth:
      headers:
        customRequestHeaders:
          Authorization: ""


    # =========================================================================
    # REDIRECTS
    # =========================================================================

    # -------------------------------------------------------------------------
    # Force HTTPS scheme -- per-router HTTP -> HTTPS redirect
    # -------------------------------------------------------------------------
    # Apply this to your `web` (port 80) router to redirect to HTTPS.
    # Each app owns this decision (no global entrypoint redirect by design --
    # app stacks may have HTTP-only routes for webhooks / IoT / health
    # probes / ACME-self-hosted / etc.).
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true


    # =========================================================================
    # PRE-COMPOSED CHAINS  (starting points -- adjust per-app)
    # =========================================================================
    # Apply with: traefik.http.routers.foo.middlewares=hardened-public@file

    # Public web app -- modern browser audience. Includes HSTS preload-
    # eligible, frame-deny, content-type-nosniff, referrer-strict,
    # compression, and rate-limit. NOT for SSE / streaming endpoints
    # (compression breaks SSE) -- swap compression for a no-op there.
    hardened-public:
      chain:
        middlewares:
          - compression
          - hsts
          - frame-deny
          - nosniff
          - referrer-strict
          - server-scrub
          - rate-limit

    # API backend -- no HSTS preload, no frame headers, sensible body cap.
    hardened-api:
      chain:
        middlewares:
          - hsts-mild
          - nosniff
          - server-scrub
          - rate-limit
          - body-limit-10mb

    # S3 / MinIO / large-file endpoint -- streaming, NO buffering, looser
    # rate-limit for high-concurrency uploads.
    s3-streaming:
      chain:
        middlewares:
          - rate-limit-permissive
          - server-scrub

    # Login / authentication endpoint -- strict rate-limit (brute-force
    # bounded), security headers, no compression (BREACH attack class).
    hardened-login:
      chain:
        middlewares:
          - hsts
          - frame-deny
          - nosniff
          - referrer-noreferrer
          - server-scrub
          - rate-limit-strict
