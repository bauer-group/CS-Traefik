# =============================================================================
# Traefik v3 - Static Configuration
# =============================================================================
# Reference: https://doc.traefik.io/traefik/reference/static-configuration/file/
#
# Static config = settings Traefik reads ONCE at startup. Routing rules,
# middlewares, and TLS options are dynamic -- those live in
# config/traefik/dynamic/*.yml and reload on change.
#
# Environment expansion: Traefik v3 resolves ${VAR:-default} from the
# container's env (passed in via docker-compose.yml) when loading this file.
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# File logging is on so Promtail (monitoring profile) can ingest it. The
# file is bind-mounted to the host -- rotation is the host's job (use
# logrotate, or just monitor disk via the Prometheus alerts in
# config/prometheus/alerts.yml). Container stdout/stderr keeps using the
# Docker json-file driver which DOES rotate (see compose `logging:`).
log:
  level: "${LOG_LEVEL:-INFO}"
  format: json
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  format: "${ACCESS_LOG_FORMAT:-json}"
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: 10ms
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent:        keep
        Authorization:     drop
        Cookie:            drop
        Set-Cookie:        drop
        X-Forwarded-For:   keep
        X-Real-Ip:         keep
        Content-Type:      keep
        Referer:           keep


# -----------------------------------------------------------------------------
# API + dashboard
# -----------------------------------------------------------------------------
# Dashboard is reachable on the dedicated `api` entrypoint (default port
# 9090, bound to 127.0.0.1 unless API_BIND in .env says otherwise) at
# the /dashboard path -- routed by the dashboard router defined as
# compose labels on the traefik service. Plain `--api.insecure=true` is
# OFF: the api endpoint is only ever reached via an authenticated router.
api:
  dashboard: true
  insecure: false
  debug: false


# -----------------------------------------------------------------------------
# Ping (healthcheck endpoint -- consumed by container HEALTHCHECK)
# -----------------------------------------------------------------------------
ping:
  entryPoint: ping
  manualRouting: false


# -----------------------------------------------------------------------------
# Entry points
# -----------------------------------------------------------------------------
# The names match the LEGACY EDGEPROXY stack so existing app stacks that
# label themselves with `entrypoints=web` / `entrypoints=web-secure` keep
# working without modification:
#
#   web         -> public HTTP  (port 80,  redirects to HTTPS by default)
#   web-secure  -> public HTTPS (port 443, with HTTP/3 / QUIC over UDP/443)
#   api         -> internal-only admin entrypoint (default 127.0.0.1:9090).
#                  All admin UIs (dashboard, Grafana, Prometheus, ...) are
#                  routed here behind BasicAuth + IP whitelist + rate-limit.
#                  Bind interface is set via API_BIND in .env; 127.0.0.1
#                  is the secure default. Set 0.0.0.0 only if you need
#                  LAN-side access (still BasicAuth-protected).
#   metrics     -> internal-only, scraped by Prometheus
#   ping        -> internal-only, container healthcheck
entryPoints:

  web:
    address: ":80/tcp"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s

  web-secure:
    address: ":443/tcp"
    http:
      tls:
        certResolver: letsencrypt
    http3:
      advertisedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s

  api:
    address: ":9090/tcp"

  metrics:
    address: ":9100/tcp"

  ping:
    address: ":8082/tcp"


# -----------------------------------------------------------------------------
# Providers
# -----------------------------------------------------------------------------
# Two sources for service / router definitions:
#   docker -> container labels (most app stacks)
#   file   -> dynamic/*.yml -- ALL files in this directory are loaded.
#             You can drop your own custom YAML here (e.g.
#             my-routes.yml, corp-tls.yml, ...) and Traefik picks them
#             up live. See dynamic/custom/README.md for examples.
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: "${NETWORK_NAME:-EDGEPROXY}"
    exposedByDefault: false
    watch: true
    allowEmptyServices: false

  file:
    directory: /etc/traefik/dynamic
    watch: true


# -----------------------------------------------------------------------------
# Certificate resolvers
# -----------------------------------------------------------------------------
# Three Let's Encrypt resolvers are pre-wired. App stacks pick one via
# label:  traefik.http.routers.<name>.tls.certresolver=letsencrypt
#
#   letsencrypt          -> production ACME with TLS-ALPN-01 challenge
#                           (port 443; matches what the legacy EDGEPROXY
#                           stack used -- DEFAULT, do not rename).
#
#   letsencrypt-http     -> production ACME with HTTP-01 challenge
#                           (port 80; useful when 443 is fronted by an
#                           upstream that terminates TLS).
#
#   letsencrypt-staging  -> ACME staging endpoint (testing, no rate-limit
#                           pain). Switch to this during initial roll-out.
#
# DNS-01 (wildcards / firewalled hosts) is documented as a commented
# template at the bottom -- intentionally NOT activated, since we have
# no DNS-provider API integration on this stack today. When that comes,
# uncomment + add provider env vars to .env.
certificatesResolvers:

  letsencrypt:
    acme:
      email: "${LETSENCRYPT_EMAIL:-admin@example.com}"
      caServer: "${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}"
      storage: /etc/traefik/certs/acme/letsencrypt.json
      keyType: EC256
      tlsChallenge: {}

  letsencrypt-http:
    acme:
      email: "${LETSENCRYPT_EMAIL:-admin@example.com}"
      caServer: "${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}"
      storage: /etc/traefik/certs/acme/letsencrypt-http.json
      keyType: EC256
      httpChallenge:
        entryPoint: web

  letsencrypt-staging:
    acme:
      email: "${LETSENCRYPT_EMAIL:-admin@example.com}"
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/certs/acme/letsencrypt-staging.json
      keyType: EC256
      tlsChallenge: {}

  # ---- DNS-01 example (PREPARED, not active) ---------------------------------
  # We currently have no DNS-provider API integration. To enable wildcards
  # for *.bauer-group.com (or any domain), uncomment the block below,
  # pick a provider from
  #   https://doc.traefik.io/traefik/https/acme/#providers
  # and add the provider-specific env vars to .env (e.g. CF_DNS_API_TOKEN
  # for Cloudflare). Then point a router at it via:
  #   traefik.http.routers.foo.tls.certresolver=letsencrypt-dns
  #   traefik.http.routers.foo.tls.domains[0].main=bauer-group.com
  #   traefik.http.routers.foo.tls.domains[0].sans=*.bauer-group.com
  #
  # letsencrypt-dns:
  #   acme:
  #     email: "${LETSENCRYPT_EMAIL:-admin@example.com}"
  #     caServer: "${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}"
  #     storage: /etc/traefik/certs/acme/letsencrypt-dns.json
  #     keyType: EC256
  #     dnsChallenge:
  #       provider: cloudflare        # change to your DNS provider
  #       resolvers:
  #         - "1.1.1.1:53"
  #         - "8.8.8.8:53"
  #       delayBeforeCheck: 10s


# -----------------------------------------------------------------------------
# Metrics (Prometheus)
# -----------------------------------------------------------------------------
# Exposed on the `metrics` entry point. The monitoring profile attaches
# Prometheus to the proxy-internal network so it can scrape :9100 without
# the metrics port being publicly reachable.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.005
      - 0.01
      - 0.025
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1.0
      - 2.5
      - 5.0
      - 10.0
    manualRouting: false


# -----------------------------------------------------------------------------
# Experimental features
# -----------------------------------------------------------------------------
experimental:
  plugins: {}
