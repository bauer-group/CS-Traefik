# =============================================================================
# Traefik v3 - Static Configuration
# =============================================================================
# Reference: https://doc.traefik.io/traefik/reference/static-configuration/file/
#
# Static config = settings Traefik reads ONCE at startup. Routing rules,
# middlewares, and TLS options are dynamic -- those live in
# config/traefik/dynamic/*.yml and reload on change.
#
# Environment expansion: Traefik v3 does NOT perform shell-style
# `${VAR:-default}` expansion in static config files. Empirically
# verified: `TRAEFIK_*` native env vars also do NOT cover fields
# under map keys (e.g. entrypoint names like `web-secure`) -- the
# upstream `paerser` library has no env-var translation for those.
#
# Strategy this file follows: HARDCODE sensible production defaults
# in YAML below, then OVERRIDE them via CLI args in
# docker-compose.yml `command:` (where Compose shell-expansion gives
# us proper `${VAR:-default}` semantics). Override priority is
# CLI > YAML, per Traefik's documented order.
#
# Why this combo: the YAML stays standalone-parseable (handy for
# `traefik validate`, CI lints, dry-runs) AND every value remains
# .env-tunable through compose. No envsubst wrapper, no fragile
# env-var-name guessing.
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# File logging is on so Promtail (monitoring profile) can ingest it. The
# file is bind-mounted to the host -- rotation is the host's job (use
# logrotate, or just monitor disk via the Prometheus alerts in
# config/prometheus/alerts.yml). Container stdout/stderr keeps using the
# Docker json-file driver which DOES rotate (see compose `logging:`).
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: 10ms
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent:        keep
        Authorization:     drop
        Cookie:            drop
        Set-Cookie:        drop
        X-Forwarded-For:   keep
        X-Real-Ip:         keep
        Content-Type:      keep
        Referer:           keep


# -----------------------------------------------------------------------------
# API + dashboard
# -----------------------------------------------------------------------------
# Dashboard is reachable on the dedicated `monitoring` entrypoint (default
# port 9090, bound to 127.0.0.1 unless MONITORING_BIND in .env says
# otherwise) at the /dashboard path -- routed by the dashboard router
# defined as compose labels on the traefik service. Plain
# `--api.insecure=true` is OFF: the api endpoint is only ever reached via
# an authenticated router.
#
# NOTE: `api:` here is the Traefik FEATURE TOGGLE (the built-in
# dashboard + REST-API service `api@internal`). Do NOT confuse it with
# the `monitoring:` entrypoint name above -- they are independent. The
# feature lives at THIS key by Traefik's hardcoded convention; only our
# entrypoint label was renamed to `monitoring`.
api:
  dashboard: true
  insecure: false
  debug: false


# -----------------------------------------------------------------------------
# Ping (healthcheck endpoint -- consumed by container HEALTHCHECK)
# -----------------------------------------------------------------------------
ping:
  entryPoint: ping
  manualRouting: false


# -----------------------------------------------------------------------------
# Entry points
# -----------------------------------------------------------------------------
# The names match the LEGACY EDGEPROXY stack so existing app stacks that
# label themselves with `entrypoints=web` / `entrypoints=web-secure` keep
# working without modification:
#
#   web         -> public HTTP  (port 80,  redirects to HTTPS by default)
#   web-secure  -> public HTTPS (port 443, with HTTP/3 / QUIC over UDP/443)
#   monitoring  -> admin UIs (dashboard, Grafana, Prometheus, Alertmanager).
#                  Container-port 9090, host-port ${MONITORING_BIND}:${MONITORING_PORT}.
#                  Legacy entrypoint name was `api`; renamed to `monitoring`
#                  in the major release because the surface is dominated
#                  by the monitoring UIs and the bundle ships only with
#                  COMPOSE_PROFILES=monitoring. The Traefik built-in
#                  service `api@internal` (which actually serves the
#                  dashboard UI) keeps its hardcoded name -- only OUR
#                  entrypoint label changed.
#   metrics     -> Prometheus scrape target on container-port 8082.
#                  Internal-only -- not exposed to the host. 8082 is the
#                  port used in the official Traefik documentation
#                  examples for the metrics entrypoint (see
#                  https://doc.traefik.io/traefik/observability/metrics/prometheus/).
#                  The container-port doesn't have to match the legacy
#                  v2 stack since this entrypoint never reaches the host.
#   ping        -> container HEALTHCHECK target on container-port 8081.
#                  Internal-only, never exposed. Only `traefik healthcheck
#                  --ping` reaches it on loopback. There is no canonical
#                  Traefik port for ping -- 8081 was picked as a clean
#                  neighbour of the metrics 8082 with no upstream conflict.
entryPoints:

  web:
    address: ":80/tcp"
    # NO global HTTP -> HTTPS redirect at the entrypoint level. The
    # legacy EDGEPROXY stack also kept this off, so app stacks could
    # decide per-router whether they want HTTPS-only or genuine HTTP
    # routes (webhooks, ACME challenges, IoT endpoints that can't TLS,
    # health probes from dumb LBs, ...). A global entrypoint redirect
    # would intercept BEFORE routers match -- making HTTP-only routes
    # impossible regardless of how an app's labels are configured.
    #
    # App stacks own their redirect: see README "Connecting your service
    # stacks" or use the `https-redirect@file` middleware as a one-liner
    # on the HTTP router.
    # http:
    #   redirections:
    #     entryPoint:
    #       to: web-secure
    #       scheme: https
    #       permanent: true
    http:
      # ALWAYS-ON middlewares (entrypoint-level, run before any router-
      # level middleware, can NOT be opted-out by an app):
      #   * bg-provider -- adds the X-Solution-Provider: BAUER GROUP
      #     identification header. Response-side only -- request-side
      #     is pointless because the backend is already in our control.
      #
      # Reach: every response from a MATCHED router on this entrypoint.
      # Traefik's built-in 404 (no matching router for the host/path)
      # is generated BEFORE the entrypoint chain and does NOT get the
      # header -- empirically verified, documented Traefik behaviour.
      # Once an app stack is bound, all of its responses (including
      # upstream 4xx/5xx) carry the header.
      #
      # Apps can layer ADDITIONAL middlewares on their routers; those
      # run AFTER the entrypoint middlewares.
      middlewares:
        - bg-provider@file
    # respondingTimeouts (readTimeout / writeTimeout / idleTimeout) are
    # set via CLI args in docker-compose.yml `command:` -- static-config
    # YAML does NOT expand `${VAR:-default}` shell syntax, so they
    # cannot live here if they need to be .env-tunable. See compose
    # `command:` section for the actual values + full rationale.

  web-secure:
    address: ":443/tcp"
    http:
      # See `web` block for the entrypoint-middleware rationale -- same
      # bg-provider always-on for HTTPS too.
      middlewares:
        - bg-provider@file
      tls:
        certResolver: letsencrypt
    http3:
      advertisedPort: 443
    # respondingTimeouts -- see `web` block + docker-compose.yml command:.

  monitoring:
    address: ":9090/tcp"

  metrics:
    address: ":8082/tcp"

  ping:
    address: ":8081/tcp"


# -----------------------------------------------------------------------------
# Providers
# -----------------------------------------------------------------------------
# Two sources for service / router definitions:
#   docker -> container labels (most app stacks)
#   file   -> dynamic/*.yml -- ALL files in this directory are loaded.
#             You can drop your own custom YAML here (e.g.
#             my-routes.yml, corp-tls.yml, ...) and Traefik picks them
#             up live. See dynamic/custom/README.md for examples.
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: EDGEPROXY
    exposedByDefault: false
    watch: true
    allowEmptyServices: false

  file:
    directory: /etc/traefik/dynamic
    watch: true


# -----------------------------------------------------------------------------
# Certificate resolvers
# -----------------------------------------------------------------------------
# Four Let's Encrypt resolvers are pre-wired. App stacks pick one per-router
# with a label:  traefik.http.routers.<name>.tls.certresolver=letsencrypt
#
# Priority order (preferred -> fallback) when picking a resolver for a host:
#
#   1.  letsencrypt          -- HTTP-01    (port 80)   -- DEFAULT, primary
#   2.  letsencrypt-tls      -- TLS-ALPN-01 (port 443) -- fallback when
#                                                          port 80 is fronted
#   3.  letsencrypt-dns      -- DNS-01      (any port) -- wildcards / hosts
#                                                          unreachable from
#                                                          public internet
#   X.  letsencrypt-staging  -- HTTP-01    (port 80)   -- testing endpoint
#
# Why HTTP-01 first?
#   * RFC 8555 marks HTTP-01 as MUST-implement. Universal compatibility.
#   * Works through CDNs / WAFs that pass through HTTP requests but might
#     not expose the underlying TLS handshake.
#   * Lowest setup friction -- no TLS state machine, just a URL fetch.
# Why TLS-ALPN-01 second?
#   * Fallback when port 80 is unreachable / hijacked / fronted by an
#     upstream proxy that terminates HTTP. Uses the same 443 listener.
# Why DNS-01 last?
#   * Slowest (DNS propagation + checks). Use only when needed for
#     wildcards (*.bauer-group.com) or fully-firewalled hosts.
certificatesResolvers:

  # ---- 1. HTTP-01 (DEFAULT) ---------------------------------------------------
  # Legacy EDGEPROXY app stacks reference `letsencrypt` -- the resolver
  # name is unchanged for drop-in compat. Only the underlying challenge
  # type switched from TLS-ALPN-01 to HTTP-01 per the documented priority
  # order. Existing certs in storage continue to work; renewals go through
  # HTTP-01 from now on.
  letsencrypt:
    acme:
      email: info@bauer-group.com
      caServer: https://acme-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/certs/letsencrypt/letsencrypt.json
      keyType: EC256
      httpChallenge:
        entryPoint: web

  # ---- 2. TLS-ALPN-01 (fallback) ---------------------------------------------
  letsencrypt-tls:
    acme:
      email: info@bauer-group.com
      caServer: https://acme-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/certs/letsencrypt/letsencrypt-tls.json
      keyType: EC256
      tlsChallenge: {}

  # ---- 3. DNS-01 (wildcards / firewalled hosts) ------------------------------
  # ACTIVE but inert until LETSENCRYPT_DNS_PROVIDER is set in .env. The
  # provider plugin is selected by the env var; credentials for ALL common
  # providers are wired through docker-compose.yml so no Compose edits are
  # needed when switching providers.
  #
  # Usage: in your app router add:
  #   traefik.http.routers.foo.tls.certresolver=letsencrypt-dns
  #   traefik.http.routers.foo.tls.domains[0].main=bauer-group.com
  #   traefik.http.routers.foo.tls.domains[0].sans=*.bauer-group.com
  #
  # Reference: https://doc.traefik.io/traefik/https/acme/#providers
  letsencrypt-dns:
    acme:
      email: info@bauer-group.com
      caServer: https://acme-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/certs/letsencrypt/letsencrypt-dns.json
      keyType: EC256
      dnsChallenge:
        # Default provider hardcoded as `cloudflare` -- the most common
        # provider in BG environments. Override via .env
        # `LETSENCRYPT_DNS_PROVIDER=<other>` (compose CLI arg). The
        # resolver is only ACTIVE when an app references it via
        # `tls.certresolver=letsencrypt-dns` -- otherwise it sits idle.
        provider: cloudflare
        # Recursive DNS resolvers used to verify that the _acme-challenge
        # TXT record has propagated. Cloudflare + Google = fast + neutral.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        # Wait this long after creating the TXT record before asking the
        # CA to validate. Increase if your provider has slow propagation
        # (some legacy providers need 30-60s).
        delayBeforeCheck: 10s
        # IPs Traefik will NOT use for the propagation check (defaults
        # are sane; override only if your DNS provider serves the TXT
        # record from a non-public IP space).
        # disablePropagationCheck: false

  # ---- X. Staging (testing) --------------------------------------------------
  # Uses HTTP-01 to mirror the production default. Switch any router to
  # this during initial rollouts to avoid the production rate limit
  # (5 duplicate certs/week, 50 certs/account/week).
  letsencrypt-staging:
    acme:
      email: info@bauer-group.com
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: /etc/traefik/certs/letsencrypt/letsencrypt-staging.json
      keyType: EC256
      httpChallenge:
        entryPoint: web


# -----------------------------------------------------------------------------
# Metrics (Prometheus)
# -----------------------------------------------------------------------------
# Exposed on the `metrics` entry point. The monitoring profile attaches
# Prometheus to the proxy-internal network so it can scrape :8082 without
# the metrics port being publicly reachable.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.005
      - 0.01
      - 0.025
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1.0
      - 2.5
      - 5.0
      - 10.0
    manualRouting: false


# -----------------------------------------------------------------------------
# Experimental features
# -----------------------------------------------------------------------------
# Plugins are intentionally NOT configured here. In Traefik v3.6 an empty
# `plugins: {}` map is a parse error ("plugins cannot be a standalone
# element") -- the block must either contain at least one plugin
# descriptor or be omitted entirely. We omit it. To enable a plugin,
# add the full block (uncomment and fill in):
#
#   experimental:
#     plugins:
#       my-plugin:
#         moduleName: github.com/example/my-plugin
#         version: v0.1.0
