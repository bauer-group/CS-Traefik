# =============================================================================
# Alertmanager - Routing Configuration
# =============================================================================
# Reference: https://prometheus.io/docs/alerting/latest/configuration/
#
# By default this config groups alerts and prints them to the log
# (no external notification). Plug in Slack/Email/PagerDuty/Webhook
# receivers below as needed -- the structure follows the upstream docs.
# =============================================================================

global:
  resolve_timeout: 5m
  # smtp_from: alerts@example.com
  # smtp_smarthost: smtp.example.com:587
  # smtp_auth_username: alerts@example.com
  # smtp_auth_password: changeme
  # smtp_require_tls: true

route:
  receiver: default
  group_by: [alertname, severity, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: default
      continue: false

receivers:
  - name: default
    # No external notifier configured by default. Uncomment a block to enable.
    #
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/T0xxxxxx/B0xxxxxx/xxxxxxxxxxxxxxxxxxxxxxxx"
    #     channel: "#alerts"
    #     send_resolved: true
    #     title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
    #     text: |
    #       {{ range .Alerts -}}
    #       *Severity:* {{ .Labels.severity }}
    #       *Instance:* {{ .Labels.instance }}
    #       *Summary:*  {{ .Annotations.summary }}
    #       *Details:*  {{ .Annotations.description }}
    #       {{ end }}
    #
    # email_configs:
    #   - to: oncall@example.com
    #     send_resolved: true

inhibit_rules:
  # Critical alerts suppress matching warning-level ones for the same target
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]
