# =============================================================================
# Alertmanager - Routing Configuration
# =============================================================================
# Reference: https://prometheus.io/docs/alerting/latest/configuration/
#
# DELIVERY MODEL -- read this before you rely on alerts:
#   Alertmanager does NOT log alert contents to stdout. A receiver with no
#   notifier is a SILENT SINK -- alerts are accepted and dropped with zero
#   output. "No receiver configured" therefore means "no alerting at all",
#   NOT "alerts visible in the log".
#
#   This stack ships a working EMAIL receiver (below) so alerts actually
#   leave the box. You MUST point `global.smtp_*` at a reachable SMTP relay.
#   Until you do, Alertmanager still starts, but each delivery attempt fails
#   LOUDLY in `docker logs <stack>-alertmanager` (a visible error -- never a
#   silent drop). Once the relay is set, alerts flow to info@bauer-group.com.
#
#   Alertmanager has NO env-var expansion (unlike Loki / Promtail), so SMTP
#   settings live in THIS file, not .env -- same pattern as prometheus.yml
#   and alerts.yml.
# =============================================================================

global:
  resolve_timeout: 5m

  # ---- SMTP relay (REQUIRED for delivery -- edit the first two lines) --------
  # Point smtp_smarthost at a mail relay that accepts mail from this host.
  # On BG hosts that is the internal smarthost. Until it resolves to a real
  # server, delivery fails visibly in the Alertmanager log (no silent drop).
  smtp_smarthost: 'smtp.example.com:587'       # TODO: real relay host:port
  smtp_from: 'alertmanager@bauer-group.com'    # TODO: sender your relay allows
  smtp_require_tls: true
  # Uncomment if the relay requires authentication (keep the secret out of
  # version control -- inject via a mounted secret / secret manager):
  # smtp_auth_username: 'alertmanager@bauer-group.com'
  # smtp_auth_password: '<set-via-secret-manager>'

route:
  receiver: default
  group_by: [alertname, severity, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # To page critical alerts through a louder channel (PagerDuty / phone),
  # add a dedicated receiver below and route to it here:
  #   routes:
  #     - matchers: [severity = critical]
  #       receiver: critical-pager

receivers:
  - name: default
    # Email is the default channel. Requires global.smtp_* above to be real.
    email_configs:
      - to: 'info@bauer-group.com'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] CS-Traefik: {{ .GroupLabels.alertname }}'
        html: |
          <h3>[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}</h3>
          {{ range .Alerts }}
          <p>
            <b>Severity:</b> {{ .Labels.severity }}<br>
            <b>Instance:</b> {{ .Labels.instance }}<br>
            <b>Summary:</b> {{ .Annotations.summary }}<br>
            <b>Details:</b> {{ .Annotations.description }}
          </p>
          {{ end }}
        text: |
          {{ range .Alerts -}}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Summary:  {{ .Annotations.summary }}
          Details:  {{ .Annotations.description }}
          {{ end }}
    # Other channels (Slack / Telegram / PagerDuty / generic webhook) work too
    # -- add a slack_configs: / webhook_configs: block here. See upstream docs.

inhibit_rules:
  # Critical alerts suppress matching warning-level ones for the same target
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]
