# =============================================================================
# Grafana - Provisioned Datasources
# =============================================================================
# Reference: https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
#
# Loaded automatically on Grafana startup. Both Prometheus and Loki resolve
# via Docker DNS on the proxy-internal network.
# =============================================================================

apiVersion: 1

datasources:

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # `--web.route-prefix=/prometheus` (set in docker-compose.monitoring.yml)
    # serves ALL of the Prometheus HTTP API under /prometheus, including
    # /api/v1/query etc. Without the path suffix Grafana queries 404.
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: High
      exemplarTraceIdDestinations: []

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
      timeout: 60
      derivedFields: []

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    # `--web.route-prefix=/alertmanager` (set in docker-compose.monitoring.yml)
    # serves the API under /alertmanager. Without the path suffix
    # Grafana's status / silences / alerts queries return 404.
    url: http://alertmanager:9093/alertmanager
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
