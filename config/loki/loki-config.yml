# =============================================================================
# Loki - Single-Binary "filesystem" Configuration
# =============================================================================
# Reference: https://grafana.com/docs/loki/latest/configure/
#
# This is the all-in-one mode -- ingester, distributor, querier, and
# compactor in one process, with chunks stored on the local filesystem.
# Right size for a single-host edge proxy. Scale to read/write microservices
# only when you outgrow this (>1 TB ingest/day).
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period: 30m
  chunk_target_size: 1572864    # 1.5 MB
  chunk_block_size: 262144      # 256 KB
  max_chunk_age: 1h
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000
  max_global_streams_per_user: 5000
  max_query_length: 721h
  max_query_parallelism: 32
  split_queries_by_interval: 24h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Disable upstream telemetry
analytics:
  reporting_enabled: false
