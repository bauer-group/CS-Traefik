# =============================================================================
# CS-Traefik - Core Stack (Traefik v3 reverse proxy)
# =============================================================================
# This is the always-on baseline -- pure reverse proxy on ports 80/443.
# Optional features live in separate overlays that traefik.sh loads on
# demand:
#   docker-compose.monitoring.yml   -> Prometheus / Grafana / Loki /
#                                      Promtail / Alertmanager / node-
#                                      exporter / cAdvisor PLUS the
#                                      host-port binding for the admin
#                                      monitoring entrypoint (default
#                                      127.0.0.1:9090). The dashboard
#                                      surface and the monitoring stack
#                                      ship together -- without this
#                                      profile, port 9090 is unbound
#                                      on the host.
#   docker-compose.auto-update.yml  -> Watchtower
#
# Direct usage (without traefik.sh):
#   docker compose up -d                                       # pure proxy
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.monitoring.yml \
#                  --profile monitoring up -d                  # full stack
#
# COMPATIBILITY NOTES (vs. legacy EDGEPROXY v2 stack):
#   - Entrypoints are named `web` and `web-secure` (with hyphen) -- IDENTICAL
#     to the legacy stack so existing app `entrypoints=web-secure` labels keep
#     working without modification.
#   - The default cert resolver is `letsencrypt` (TLS-ALPN-01) -- IDENTICAL.
#   - The public network defaults to ${NETWORK_NAME:-EDGEPROXY} -- IDENTICAL.
#   - Admin UIs (dashboard) live on the dedicated `monitoring` entrypoint, NOT on
#     port 443 (matches the legacy localhost:9090 pattern). The host-port
#     binding for that entrypoint now lives in the monitoring overlay --
#     pure-proxy installs no longer expose 9090 on the host at all.
# =============================================================================

name: ${STACK_NAME:-edgeproxy}


# =============================================================================
# Shared logging policy (YAML anchor, referenced by every service)
# =============================================================================
# `mode: non-blocking` is the critical bit -- when the json-file driver's
# ring buffer fills (because Promtail / log shipper isn't reading fast
# enough), the kernel default behaviour is to BLOCK the container's
# write() calls. On Traefik that means request handling stalls behind
# log writes -- a log-pipeline issue silently becomes a request-pipeline
# issue. With `mode: non-blocking`, the driver drops log lines instead.
# Logs are non-critical, serving traffic is critical: this is the right
# trade-off for an edge proxy stack.
#
# `max-buffer-size: 4m` sizes the per-container ring buffer. ~10-50k log
# lines depending on length -- absorbs spikes before drops kick in.
x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: ${LOG_MAX_BUFFER_SIZE:-4m}
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILE:-5}"


services:

  # ---------------------------------------------------------------------------
  # Traefik
  # ---------------------------------------------------------------------------
  traefik:
    # Default floats on the v3 MAJOR tag: minor + patch releases flow in
    # automatically (bugfixes / non-breaking features), but the tag can
    # never resolve to v4 -- a major jump stays a deliberate .env change.
    # Pin an exact minor (TRAEFIK_IMAGE_TAG=v3.6) in change-controlled
    # environments where every image bump needs a ticket.
    image: traefik:${TRAEFIK_IMAGE_TAG:-v3}
    container_name: ${STACK_NAME:-edgeproxy}-traefik
    hostname: traefik
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # OOM bias -- light protection only. The hierarchy under host memory
    # pressure is:
    #
    #   Tier 0  systemd init / kernel threads      kernel-immune (auto)
    #   Tier 1  sshd, dockerd                      -500 (distro default)
    #   Tier 2  Traefik                             -50 <-- THIS LINE
    #   Tier 3  customer-facing app containers       0  (no override)
    #   Tier 4  monitoring containers              +200 (compose.monitoring.yml)
    #
    # Why -50 not stronger: a reverse proxy without backends is dead
    # weight. If app containers (at 0) start getting killed under
    # memory pressure, Traefik should be in the same general danger
    # zone, not artificially shielded for tiers longer. -50 just gives
    # Traefik a slight edge over monitoring (+200) so request routing
    # stays alive long enough for restart loops to recover. SSH +
    # dockerd remain at the strongest protection (kernel sees them as
    # essential for host management).
    oom_score_adj: -50
    labels:
      # Opt-in to the optional auto-update profile via Watchtower.
      com.centurylinklabs.watchtower.enable: "true"

      # =========================================================================
      # Dashboard routers -- monitoring entrypoint by default; public 443 only via Mode 3.
      # =========================================================================
      # The `monitoring` entrypoint listens on :9090 INSIDE the container
      # (config/traefik/traefik.yml), but its HOST-port binding lives in
      # docker-compose.monitoring.yml under `profiles: [monitoring]` -- NOT
      # in this file. So a pure-proxy install (empty COMPOSE_PROFILES) binds
      # no 9090 on the host at all: the dashboard is then reachable only from
      # containers on the proxy-internal network via `traefik:9090`.
      #
      # With the monitoring profile active, 9090 binds to
      # ${MONITORING_BIND:-127.0.0.1}:${MONITORING_PORT:-9090} -- loopback by
      # default. SSH-tunnel for remote access:
      #   ssh -L 9090:127.0.0.1:9090 user@server
      #   then open http://127.0.0.1:9090/dashboard/
      #
      # Mode 3 -- to expose admin UIs on a public FQDN (https://${MONITORING_HOST}/),
      # set MONITORING_HOST in .env: the dashboard-public router on web-secure
      # activates automatically (BasicAuth + IP whitelist enforced). This path
      # rides on 443 (part of THIS base stack), so it works in a pure-proxy
      # install too -- no monitoring profile required.
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}"

      # =========================================================================
      # Router priority hierarchy (explicit on EVERY admin router)
      # =========================================================================
      # Traefik's default priority equals the rule-string length, which is
      # deterministic but NOT semantic -- a cosmetic refactor (` || ` -> `||`)
      # changes the score and can silently flip routing decisions. We pin
      # explicit priorities on every admin-related router so future edits
      # cannot shadow each other unexpectedly.
      #
      #   dashboard-internal     300   intercepts proxy-internal CIDRs on `monitoring`
      #   dashboard-public       300   admin FQDN on `web-secure` (mode 3)
      #   dashboard-public-http  300   admin FQDN on `web` (HTTP -> HTTPS redirect)
      #   dashboard-local        200   catch-all admin gate on `monitoring` (BasicAuth + whitelist)
      #
      # Why 300 / 200 instead of e.g. 200 / 1?
      #
      # Implicit (rule-length-scored) priorities for typical app routers
      # range up to ~150 -- a maximally specific `Host(\`a.b.com\`) &&
      # PathPrefix(\`/api\`) && Method(\`GET\`,\`POST\`) && Headers(...)`
      # rule lands somewhere around 100-150. The catch-all admin gate
      # MUST sit above this implicit max, otherwise an app accidentally
      # added on the `monitoring` entrypoint with a long rule could outrank it
      # and bypass BasicAuth + whitelist. Priority 200 gives a 50-point
      # safety margin.
      #
      # Intercept routers (dashboard-internal, dashboard-public[-http])
      # need to win over the catch-all gate AND over any app -- so they
      # sit at 300, another 100-point margin above the catch-all.
      #
      # Three-tier hierarchy keeps the intent readable:
      #   * 300 = "must intercept this specific case"
      #   * 200 = "fallback admin gate, beats any app"
      #   * 1 ... ~150 = "everything else (apps, implicit-scored)"
      #
      # New routers on the monitoring entrypoint that should take precedence over
      # dashboard-local need priority >= 250. Fully-controlled override
      # cases (test routers, debug-only paths) can use 400+ to beat even
      # the intercepts.
      # =========================================================================

      # ---- Internal-network dashboard (no auth, no whitelist gate) ----
      # Matches ONLY when the source IP is in the EDGEPROXY-INTERNAL Docker
      # subnet (where the monitoring stack lives). Network membership IS the
      # trust boundary -- only services we attach to that internal network
      # can send from those ranges. BasicAuth on top would be security
      # theatre AND create an operational footgun (operators forgetting
      # credentials in monitoring containers).
      #
      # Hardcoded CIDRs (NOT taken from MONITORING_WHITELIST): the internal
      # subnet ranges are fixed by the network: definition at the
      # bottom of this file (100.64.0.0/16 + fdff:100:64::/64) -- they
      # are infrastructure constants, not policy. MONITORING_WHITELIST is for
      # EXTERNAL access policy only. This split prevents an over-
      # restrictive MONITORING_WHITELIST from accidentally locking the
      # monitoring stack out of the admin surface.
      # Path(`/`) is included so the dashboard-redirect middleware below can
      # see bare-host requests and 302 them to /dashboard/. Without it, the
      # router never matches `/` and Traefik returns its built-in 404 before
      # any middleware runs.
      traefik.http.routers.dashboard-internal.rule: "(Path(`/`) || PathPrefix(`/api`) || PathPrefix(`/dashboard`)) && (ClientIP(`100.64.0.0/16`) || ClientIP(`fdff:100:64::/64`))"
      traefik.http.routers.dashboard-internal.entrypoints: "monitoring"
      traefik.http.routers.dashboard-internal.service: "api@internal"
      traefik.http.routers.dashboard-internal.priority: "300"
      traefik.http.routers.dashboard-internal.middlewares: "dashboard-redirect"

      # ---- Localhost dashboard (BasicAuth + IP whitelist, on `monitoring` entrypoint) ----
      # Catches everything else on the monitoring entrypoint -- operator access via
      # SSH tunnel to host loopback. BasicAuth + MONITORING_WHITELIST gate apply.
      # Internal-network requests are intercepted by dashboard-internal above
      # before they reach this router.
      #
      # Priority 200 = "catch-all admin gate, beats any app." Sits above
      # the implicit-priority max (~150) of even the most specific
      # default-scored app rule. Any app accidentally exposed on the `monitoring`
      # entrypoint cannot bypass the BasicAuth + whitelist gate just by
      # having a long rule string. Override only with explicit priority
      # >= 250 if you really mean to.
      # Path(`/`) -- see dashboard-internal rule above. Bare host needs to
      # reach the dashboard-redirect middleware to land on /dashboard/.
      traefik.http.routers.dashboard-local.rule: "Path(`/`) || PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      traefik.http.routers.dashboard-local.entrypoints: "monitoring"
      traefik.http.routers.dashboard-local.service: "api@internal"
      traefik.http.routers.dashboard-local.priority: "200"
      traefik.http.routers.dashboard-local.middlewares: "monitoring-auth,monitoring-whitelist,dashboard-redirect"

      # ---- Public dashboard (only when MONITORING_HOST is set in .env) ----
      # Fail-closed when MONITORING_HOST is unset: the rule resolves to
      # `Host(\`__monitoring_host_not_set__.invalid\`)`, which never matches any
      # real client request because `.invalid` is RFC 2606 reserved and
      # cannot resolve in DNS. The router is technically active but
      # unreachable -- exactly the desired "mode-3 disabled" state.
      #
      # We use `${VAR:-fallback}` (not the previous `${VAR:+...}`) because
      # an empty rule string causes Traefik to fall back to the docker
      # provider's default rule `Host(\`{{normalize .Name}}\`)`, which would
      # silently route on the container name -- the OPPOSITE of fail-closed.
      # The placeholder hostname pattern is local to this single router,
      # so there is no global behaviour change for any other apps in the
      # stack.
      #
      # Priority 300 protects the admin FQDN from being shadowed by an app
      # router that uses `HostRegexp(\`.*\`)` or another wide matcher on the
      # same entrypoint -- well above any plausible default-scored app rule
      # (which top out around ~150 by rule-string length).
      # Path(`/`) -- same reason as dashboard-internal/local above. Host()
      # still scopes the match to the admin FQDN; only `/` requests for that
      # exact host get the redirect.
      traefik.http.routers.dashboard-public.rule: "Host(`${MONITORING_HOST:-__monitoring_host_not_set__.invalid}`) && (Path(`/`) || PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      traefik.http.routers.dashboard-public.entrypoints: "web-secure"
      traefik.http.routers.dashboard-public.service: "api@internal"
      traefik.http.routers.dashboard-public.tls: "true"
      traefik.http.routers.dashboard-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.dashboard-public.priority: "300"
      traefik.http.routers.dashboard-public.middlewares: "monitoring-auth,monitoring-whitelist,dashboard-redirect"

      # ---- Public dashboard HTTP redirect (only when MONITORING_HOST is set) ----
      # Admin FQDN should always be HTTPS-only -- accept HTTP only to send
      # a 301 to HTTPS. The IP whitelist is applied here too, so even the
      # redirect itself isn't visible to non-whitelisted clients.
      # No global entrypoint redirect: app stacks decide per-router.
      #
      # Same fail-closed pattern as dashboard-public above: when MONITORING_HOST
      # is unset, the rule becomes `Host(\`__monitoring_host_not_set__.invalid\`)`
      # which cannot match any real client request.
      #
      # Priority 300 -- same FQDN-shadow protection as dashboard-public.
      traefik.http.routers.dashboard-public-http.rule: "Host(`${MONITORING_HOST:-__monitoring_host_not_set__.invalid}`)"
      traefik.http.routers.dashboard-public-http.entrypoints: "web"
      traefik.http.routers.dashboard-public-http.service: "api@internal"
      traefik.http.routers.dashboard-public-http.priority: "300"
      traefik.http.routers.dashboard-public-http.middlewares: "monitoring-whitelist,https-redirect@file"

      # ---- Middlewares used by both routers above ----
      # Defined here (not in dynamic/middlewares.yml) so they pick up
      # ${DASHBOARD_USERS} / ${MONITORING_WHITELIST} from .env via Compose
      # substitution -- one source of truth.
      traefik.http.middlewares.monitoring-whitelist.ipallowlist.sourcerange: "${MONITORING_WHITELIST:-127.0.0.1/32, ::1/128}"
      traefik.http.middlewares.monitoring-auth.basicauth.users: "${MONITORING_USERS:-}"
      traefik.http.middlewares.monitoring-auth.basicauth.realm: "CS-Traefik Admin"
      traefik.http.middlewares.monitoring-auth.basicauth.removeheader: "true"
      # Redirect bare / to /dashboard/ for convenience.
      traefik.http.middlewares.dashboard-redirect.redirectregex.regex: "^https?://[^/]+/?$$"
      traefik.http.middlewares.dashboard-redirect.redirectregex.replacement: "/dashboard/"
      traefik.http.middlewares.dashboard-redirect.redirectregex.permanent: "false"

    # CLI args -- override the YAML-hardcoded defaults in /etc/traefik/
    # traefik.yml. Why CLI args, not static-config or `TRAEFIK_*` env
    # vars? Empirically:
    #   * Static YAML does NOT shell-expand ${VAR:-default}.
    #   * `TRAEFIK_*` env vars do NOT cover map-key fields (entrypoint
    #     names, resolver names, ...) -- paerser limitation.
    # CLI args are the only path that gives full coverage AND clean
    # `${VAR:-default}` semantics. Override priority is CLI > YAML, so
    # `traefik.yml` defaults stay parseable standalone (handy for
    # `traefik validate` / CI lints) while every value remains
    # .env-tunable through the lines below.
    #
    # ── Logging tunables (apply to whole proxy) ──────────────────────────
    #   LOG_LEVEL         (default INFO)  ERROR | WARN | INFO | DEBUG | TRACE
    #   ACCESS_LOG_FORMAT (default json)  json | common
    #
    # ── Provider tunables ────────────────────────────────────────────────
    #   NETWORK_NAME      (default EDGEPROXY)  Docker network Traefik
    #                     watches for service auto-discovery.
    #
    # ── ACME tunables (apply to all 3 production resolvers) ──────────────
    #   LETSENCRYPT_EMAIL (default info@bauer-group.com)
    #   LETSENCRYPT_CA    (default https://acme-v02.api.letsencrypt.org/
    #                     directory) -- override to staging URL for testing
    #                     without burning prod rate limits.
    #   LETSENCRYPT_DNS_PROVIDER (default cloudflare) -- only consulted
    #                     when an app uses tls.certresolver=letsencrypt-dns.
    #
    # ── respondingTimeouts (per entrypoint) ─────────────────────────────
    #   WEB_READ_TIMEOUT  (default 0s)   -- no upper bound on request
    #     body. Required for: large file uploads over slow links (S3
    #     multipart on mobile), MinIO presigned-URL pushes, video
    #     uploads, webhooks with long-running server logic.
    #   WEB_WRITE_TIMEOUT (default 0s)   -- no upper bound on response.
    #     Required for: SSE / event-stream, streaming downloads, slow
    #     backends responding to large queries.
    #   WEB_IDLE_TIMEOUT  (default 300s) -- close keepalive connections
    #     idle for 5 minutes. Bumped from Traefik default 180s so
    #     WebSocket apps that don't ping every 3 minutes don't get cut.
    #     Slowloris-hardening: if your threat model needs a hard cap,
    #     set WEB_READ_TIMEOUT=600s -- still allows 100MB uploads on
    #     128 kbit/s mobile but caps single-connection hold time.
    command:
      # Logging
      - --log.level=${LOG_LEVEL:-INFO}
      - --accesslog.format=${ACCESS_LOG_FORMAT:-json}

      # Docker provider
      - --providers.docker.network=${NETWORK_NAME:-EDGEPROXY}

      # ACME -- letsencrypt (HTTP-01)
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}

      # ACME -- letsencrypt-tls (TLS-ALPN-01)
      - --certificatesresolvers.letsencrypt-tls.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt-tls.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}

      # ACME -- letsencrypt-dns (DNS-01, wildcards / firewalled hosts)
      - --certificatesresolvers.letsencrypt-dns.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt-dns.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=${LETSENCRYPT_DNS_PROVIDER:-cloudflare}

      # ACME -- letsencrypt-staging (always staging endpoint, only email overridable)
      - --certificatesresolvers.letsencrypt-staging.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}

      # respondingTimeouts on web (HTTP) entrypoint
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=${WEB_READ_TIMEOUT:-0s}
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=${WEB_WRITE_TIMEOUT:-0s}
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=${WEB_IDLE_TIMEOUT:-300s}

      # respondingTimeouts on web-secure (HTTPS) entrypoint
      - --entrypoints.web-secure.transport.respondingTimeouts.readTimeout=${WEB_READ_TIMEOUT:-0s}
      - --entrypoints.web-secure.transport.respondingTimeouts.writeTimeout=${WEB_WRITE_TIMEOUT:-0s}
      - --entrypoints.web-secure.transport.respondingTimeouts.idleTimeout=${WEB_IDLE_TIMEOUT:-300s}

    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      # ---- DNS-01 challenge: provider selector ------------------------------
      # The `letsencrypt-dns` resolver in traefik.yml uses this to pick the
      # provider plugin at runtime. Empty = DNS-01 disabled.
      LETSENCRYPT_DNS_PROVIDER: ${LETSENCRYPT_DNS_PROVIDER:-}

      # ---- DNS-01 provider credentials (pass-through) -----------------------
      # All credentials for the providers Traefik supports are wired through
      # here as ${VAR:-}. Setting a value in .env activates it; the rest are
      # passed as empty strings (inert -- the provider plugin only consumes
      # the env vars it needs).
      #
      # If your provider isn't in the list, add the relevant env vars to
      # .env -- since Compose reads .env into every service's environment
      # by default, additions reach the container without changes here. The
      # explicit pass-through below is a documented "supported set" that
      # also serves as a quick reference of what env each provider needs.
      #
      # Reference: https://doc.traefik.io/traefik/https/acme/#providers

      # ---- Cloudflare ----
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      CF_ZONE_API_TOKEN: ${CF_ZONE_API_TOKEN:-}

      # ---- AWS Route 53 ----
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}

      # ---- Google Cloud DNS ----
      GCE_PROJECT: ${GCE_PROJECT:-}
      GCE_SERVICE_ACCOUNT_FILE: ${GCE_SERVICE_ACCOUNT_FILE:-}
      GCE_SERVICE_ACCOUNT: ${GCE_SERVICE_ACCOUNT:-}

      # ---- Azure DNS ----
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
      AZURE_ENVIRONMENT: ${AZURE_ENVIRONMENT:-}

      # ---- Hetzner DNS ----
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}

      # ---- IONOS (1&1) ----
      IONOS_API_KEY: ${IONOS_API_KEY:-}

      # ---- Netcup (DE) ----
      NETCUP_CUSTOMER_NUMBER: ${NETCUP_CUSTOMER_NUMBER:-}
      NETCUP_API_KEY: ${NETCUP_API_KEY:-}
      NETCUP_API_PASSWORD: ${NETCUP_API_PASSWORD:-}

      # ---- INWX (DE registrar) ----
      INWX_USERNAME: ${INWX_USERNAME:-}
      INWX_PASSWORD: ${INWX_PASSWORD:-}
      INWX_SHARED_SECRET: ${INWX_SHARED_SECRET:-}
      INWX_SANDBOX: ${INWX_SANDBOX:-}

      # ---- Hosting.de ----
      HOSTINGDE_API_KEY: ${HOSTINGDE_API_KEY:-}
      HOSTINGDE_ZONE_NAME: ${HOSTINGDE_ZONE_NAME:-}

      # ---- DigitalOcean ----
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}

      # ---- Linode ----
      LINODE_TOKEN: ${LINODE_TOKEN:-}

      # ---- Vultr ----
      VULTR_API_KEY: ${VULTR_API_KEY:-}

      # ---- OVH ----
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}

      # ---- Gandi v5 ----
      GANDIV5_PERSONAL_ACCESS_TOKEN: ${GANDIV5_PERSONAL_ACCESS_TOKEN:-}
      GANDIV5_API_KEY: ${GANDIV5_API_KEY:-}

      # ---- DNSimple ----
      DNSIMPLE_OAUTH_TOKEN: ${DNSIMPLE_OAUTH_TOKEN:-}
      DNSIMPLE_BASE_URL: ${DNSIMPLE_BASE_URL:-}

      # ---- Namecheap ----
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}

      # ---- GoDaddy ----
      GODADDY_API_KEY: ${GODADDY_API_KEY:-}
      GODADDY_API_SECRET: ${GODADDY_API_SECRET:-}

      # ---- DNSPod (Tencent) ----
      DNSPOD_API_KEY: ${DNSPOD_API_KEY:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}

      # ---- DuckDNS ----
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}

      # ---- DesignateDNS (OpenStack) ----
      OS_AUTH_URL: ${OS_AUTH_URL:-}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_TENANT_NAME: ${OS_TENANT_NAME:-}
      OS_REGION_NAME: ${OS_REGION_NAME:-}

      # ---- Scaleway ----
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}

      # ---- ACME-DNS (alias-based, works with any provider via CNAME) ----
      ACME_DNS_API_BASE: ${ACME_DNS_API_BASE:-}
      ACME_DNS_STORAGE_PATH: ${ACME_DNS_STORAGE_PATH:-}

      # ---- RFC 2136 (BIND, Knot, PowerDNS via dynamic updates) ----
      RFC2136_NAMESERVER: ${RFC2136_NAMESERVER:-}
      RFC2136_TSIG_ALGORITHM: ${RFC2136_TSIG_ALGORITHM:-}
      RFC2136_TSIG_KEY: ${RFC2136_TSIG_KEY:-}
      RFC2136_TSIG_SECRET: ${RFC2136_TSIG_SECRET:-}

      # ---- Generic exec hook (custom DNS providers via shell script) ----
      EXEC_PATH: ${EXEC_PATH:-}
      EXEC_MODE: ${EXEC_MODE:-}
    ports:
      # ---- Public HTTP (port 80) -- IPv4 + IPv6 dual-stack ------------------
      # Compose's bare `80:80` syntax binds to 0.0.0.0 (IPv4) only by
      # default. Modern deployments need both stacks -- mobile carriers,
      # consumer ISPs, and cloud providers all hand out IPv6 to clients
      # alongside IPv4. We bind to BOTH explicitly so behaviour is
      # portable across kernels and Docker versions (some kernels
      # dual-stack [::] automatically via IPV6_V6ONLY=0, but that is
      # config-dependent -- explicit beats clever).
      - "0.0.0.0:${HTTP_PORT:-80}:80/tcp"
      - "[::]:${HTTP_PORT:-80}:80/tcp"

      # ---- Public HTTPS (port 443 TCP) -- IPv4 + IPv6 ----------------------
      - "0.0.0.0:${HTTPS_PORT:-443}:443/tcp"
      - "[::]:${HTTPS_PORT:-443}:443/tcp"

      # ---- Public HTTPS (port 443 UDP) -- HTTP/3 (QUIC) -- IPv4 + IPv6 -----
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
      - "[::]:${HTTPS_PORT:-443}:443/udp"

      # ---- Admin monitoring entrypoint host-port binding -- moved out -------------
      # The 127.0.0.1:9090 host-port mapping lives in
      # docker-compose.monitoring.yml so pure-proxy installs do not
      # expose 9090 on the host at all. The monitoring entrypoint itself stays
      # defined in config/traefik/traefik.yml (`monitoring: address:
      # ":9090/tcp"`) -- it keeps listening inside the container, so
      # internal traffic on the proxy-internal network (e.g. monitoring
      # scrapes hitting `traefik:9090`) still works regardless of the
      # host binding.
      #
      # Bottom line: COMPOSE_PROFILES=monitoring -> 9090 bound;
      # otherwise 9090 is internal-only. There is no separate overlay
      # to manage -- one profile, one decision.
    volumes:
      # Docker socket -- the provider needs to read containers + events.
      # No `:ro`: on a unix socket that flag only protects the inode, NOT
      # the Docker API (anyone who can talk to the socket can POST
      # /containers/create with Privileged+host mounts = host root). It
      # conferred nothing, so it is dropped rather than implying a guarantee
      # it never gave. Real scoping needs a docker-socket-proxy -- a planned
      # hardening step, deferred for now (dashboard is already auth-gated).
      - /var/run/docker.sock:/var/run/docker.sock

      # Static + dynamic configuration (read-only).
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro

      # Manual certificates -- drop *.crt + *.key here and reference from
      # config/traefik/dynamic/tls.yml.
      - ./config/certs/static:/etc/traefik/certs/static:ro

      # Let's Encrypt ACME storage (read-write -- contains issued certs +
      # ACME account key). Backed up by `traefik.sh backup`.
      - ${DATA_DIRECTORY:-./data}/traefik/letsencrypt:/etc/traefik/certs/letsencrypt:rw

      # Access + traefik.log (read by Promtail under monitoring profile).
      - ${DATA_DIRECTORY:-./data}/traefik/logs:/var/log/traefik:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # NO `deploy.resources.limits` on Traefik. The edge proxy is the
    # single hot path for ALL ingress traffic -- artificially capping
    # its CPU triggers Linux CFS throttling under spikes (100ms freezes
    # that look like 502s / timeouts to clients) even when the host has
    # idle headroom. If you specifically need to cap Traefik (multi-
    # tenant Docker host), add a docker-compose.override.yml at the
    # repo root -- Compose merges it automatically.
    logging: *default-logging


# =============================================================================
# Networks
# =============================================================================
# `proxy` = EDGEPROXY public bridge -- service stacks attach as
# `external: true` to be discovered by Traefik. Subnets are CGNAT
# (100.65.0.0/16) + ULA (fdff:100:65::/64) -- byte-for-byte identical
# to the legacy v2 EDGEPROXY stack.
#
# `proxy-internal` = internal-only sidecar network for Traefik <->
# monitoring chatter. Subnets 100.64.0.0/16 + fdff:100:64::/64 --
# Not reachable from the host's public interfaces.
networks:
  proxy:
    name: ${NETWORK_NAME:-EDGEPROXY}
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.65.0.0/16
          gateway: 100.65.0.1
        - subnet: fdff:100:65::/64
          gateway: fdff:100:65::1
  proxy-internal:
    name: ${NETWORK_NAME:-EDGEPROXY}-INTERNAL
    driver: bridge
    internal: false
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.64.0.0/16
          gateway: 100.64.0.1
        - subnet: fdff:100:64::/64
          gateway: fdff:100:64::1
