# =============================================================================
# CS-Traefik - Core Stack (Traefik v3 reverse proxy)
# =============================================================================
# This is the always-on baseline. Optional features live in separate
# overlays that traefik.sh loads on demand:
#   docker-compose.monitoring.yml   -> Prometheus / Grafana / Loki / ...
#   docker-compose.auto-update.yml  -> Watchtower
#
# Direct usage (without traefik.sh):
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# =============================================================================

name: ${STACK_NAME:-edgeproxy}

services:

  # ---------------------------------------------------------------------------
  # Traefik
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_IMAGE_TAG:-v3.6}
    container_name: ${STACK_NAME:-edgeproxy}-traefik
    hostname: traefik
    restart: unless-stopped
    # Drop all caps; only re-add the few Traefik actually needs (binding
    # privileged ports 80/443 needs NET_BIND_SERVICE on rootless setups).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Stop_grace_period: long enough for in-flight requests to drain
    # gracefully (default Traefik graceful timeout is 10s).
    stop_grace_period: 30s
    labels:
      # Opt-in to the optional auto-update profile via Watchtower.
      com.centurylinklabs.watchtower.enable: "true"

      # ---- Self-routing for the dashboard ------------------------------
      # The Traefik dashboard is reached only on its dedicated FQDN over
      # HTTPS, with bcrypt BasicAuth + IP whitelist + rate-limit. Path
      # prefixes on the public 80/443 entrypoints are NOT exposed (legacy
      # stack used a path-prefix; we now isolate the admin surface).
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}"

      traefik.http.routers.dashboard.rule: "Host(`${DASHBOARD_HOST:-traefik.example.com}`)"
      traefik.http.routers.dashboard.entrypoints: "websecure"
      traefik.http.routers.dashboard.service: "api@internal"
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: "letsencrypt"
      # Middlewares for the dashboard. The order matters -- whitelist runs
      # first (cheap reject of unauthorised IPs), THEN auth, THEN strict
      # rate-limit, THEN security headers on the response.
      traefik.http.routers.dashboard.middlewares: "dashboard-whitelist,dashboard-auth,rate-limit-strict@file,secure-headers@file"

      # Dashboard middlewares -- defined here (not in dynamic/middlewares.yml)
      # because their values come from .env and Compose substitution is the
      # cleanest way to wire env -> Traefik for these.
      traefik.http.middlewares.dashboard-whitelist.ipallowlist.sourcerange: "${DASHBOARD_WHITELIST:-127.0.0.1/32, ::1/128}"
      traefik.http.middlewares.dashboard-auth.basicauth.users: "${DASHBOARD_USERS:-}"
      traefik.http.middlewares.dashboard-auth.basicauth.realm: "CS-Traefik Dashboard"
      traefik.http.middlewares.dashboard-auth.basicauth.removeheader: "true"

    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
      # ---- Substituted into traefik.yml at runtime via env-expansion ----
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ACCESS_LOG_FORMAT: ${ACCESS_LOG_FORMAT:-json}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
      LETSENCRYPT_CA: ${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}
      LETSENCRYPT_CHALLENGE: ${LETSENCRYPT_CHALLENGE:-tlschallenge}
      LETSENCRYPT_DNS_PROVIDER: ${LETSENCRYPT_DNS_PROVIDER:-}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-traefik.example.com}
      DASHBOARD_USERS: ${DASHBOARD_USERS:-}
      DASHBOARD_WHITELIST: ${DASHBOARD_WHITELIST:-127.0.0.1/32}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-true}
      NETWORK_NAME: ${NETWORK_NAME:-EDGEPROXY}
      TRAEFIK_TRUSTED_IPS: ${TRAEFIK_TRUSTED_IPS:-}
      # DNS-01 provider credentials (passed through; Traefik reads them
      # automatically based on LETSENCRYPT_DNS_PROVIDER).
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3 (QUIC)
    volumes:
      # Read-only socket. For higher security, replace with the
      # `tecnativa/docker-socket-proxy` sidecar -- the dashboard router
      # already isolates the admin API on its own subdomain.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Static + dynamic configuration (read-only).
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro

      # Manual certificates (read-only). Drop *.crt + *.key here and
      # reference them in config/traefik/dynamic/tls.yml.
      - ./config/certs/static:/etc/traefik/certs/static:ro

      # Let's Encrypt ACME storage (read-write -- contains issued certs +
      # the ACME account key). Backed up by `traefik.sh backup`.
      - ${DATA_DIRECTORY:-./data}/traefik/acme:/etc/traefik/certs/acme:rw

      # Access + Traefik own logs (read by Promtail when monitoring is on).
      - ${DATA_DIRECTORY:-./data}/traefik/logs:/var/log/traefik:rw
    networks:
      # `proxy` = the public-facing network every service stack joins
      # to be reached by Traefik. Default name is EDGEPROXY (legacy).
      proxy:
      # `proxy-internal` = an internal-only sidecar network that the
      # monitoring profile attaches to so Prometheus can scrape Traefik
      # without exposing the metrics port to the public network.
      proxy-internal:
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPU_LIMIT:-2}"
          memory: ${TRAEFIK_MEMORY_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"


# =============================================================================
# Networks
# =============================================================================
# `proxy` is the EDGEPROXY public network -- service stacks attach to it
# as `external: true` to be discovered by Traefik. Subnet is set in CGN
# range (100.65.0.0/16) to avoid clashing with typical RFC1918 LANs.
#
# `proxy-internal` is for Traefik <-> monitoring chatter. Internal-only
# (no host port mappings, no public reachability). Subnet 100.64.0.0/16.
networks:
  proxy:
    name: ${NETWORK_NAME:-EDGEPROXY}
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.65.0.0/16
          gateway: 100.65.0.1
        - subnet: fdff:100:65::/64
          gateway: fdff:100:65::1
  proxy-internal:
    name: ${NETWORK_NAME:-EDGEPROXY}-internal
    driver: bridge
    internal: false
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.64.0.0/16
          gateway: 100.64.0.1
        - subnet: fdff:100:64::/64
          gateway: fdff:100:64::1
