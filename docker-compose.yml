# =============================================================================
# CS-Traefik - Core Stack (Traefik v3 reverse proxy)
# =============================================================================
# This is the always-on baseline. Optional features live in separate
# overlays that traefik.sh loads on demand:
#   docker-compose.monitoring.yml   -> Prometheus / Grafana / Loki / ...
#   docker-compose.auto-update.yml  -> Watchtower
#
# Direct usage (without traefik.sh):
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# COMPATIBILITY NOTES (vs. legacy EDGEPROXY v2 stack):
#   - Entrypoints are named `web` and `web-secure` (with hyphen) -- IDENTICAL
#     to the legacy stack so existing app `entrypoints=web-secure` labels keep
#     working without modification.
#   - The default cert resolver is `letsencrypt` (TLS-ALPN-01) -- IDENTICAL.
#   - The public network defaults to ${NETWORK_NAME:-EDGEPROXY} -- IDENTICAL.
#   - Admin UIs (dashboard) live on the dedicated `api` entrypoint, NOT on
#     port 443 (matches the legacy localhost:9090 pattern).
# =============================================================================

name: ${STACK_NAME:-edgeproxy}


# =============================================================================
# Shared logging policy (YAML anchor, referenced by every service)
# =============================================================================
# `mode: non-blocking` is the critical bit -- when the json-file driver's
# ring buffer fills (because Promtail / log shipper isn't reading fast
# enough), the kernel default behaviour is to BLOCK the container's
# write() calls. On Traefik that means request handling stalls behind
# log writes -- a log-pipeline issue silently becomes a request-pipeline
# issue. With `mode: non-blocking`, the driver drops log lines instead.
# Logs are non-critical, serving traffic is critical: this is the right
# trade-off for an edge proxy stack.
#
# `max-buffer-size: 4m` sizes the per-container ring buffer. ~10-50k log
# lines depending on length -- absorbs spikes before drops kick in.
x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: ${LOG_MAX_BUFFER_SIZE:-4m}
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILE:-5}"


services:

  # ---------------------------------------------------------------------------
  # Traefik
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_IMAGE_TAG:-v3.6}
    container_name: ${STACK_NAME:-edgeproxy}-traefik
    hostname: traefik
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    labels:
      # Opt-in to the optional auto-update profile via Watchtower.
      com.centurylinklabs.watchtower.enable: "true"

      # =========================================================================
      # Dashboard router -- on the dedicated `api` entrypoint, NEVER on 443.
      # =========================================================================
      # The api entrypoint binds to ${API_BIND:-127.0.0.1}:${API_PORT:-9090}
      # (see ports section) so by default the dashboard is reachable ONLY
      # via the Docker host's loopback. SSH-tunnel for remote access:
      #   ssh -L 9090:127.0.0.1:9090 user@server
      #   then open http://127.0.0.1:9090/dashboard/
      #
      # To also expose admin UIs on a public FQDN (https://${API_HOST}/),
      # set API_HOST in .env -- a second router on web-secure activates
      # automatically (BasicAuth + IP whitelist enforced).
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}"

      # ---- Localhost dashboard (always on, on the `api` entrypoint) ----
      traefik.http.routers.dashboard-local.rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      traefik.http.routers.dashboard-local.entrypoints: "api"
      traefik.http.routers.dashboard-local.service: "api@internal"
      traefik.http.routers.dashboard-local.middlewares: "api-auth,api-whitelist,dashboard-redirect"

      # ---- Public dashboard (only when API_HOST is set in .env) ----
      # The `${API_HOST:+...}` syntax: empty when API_HOST is unset, so the
      # rule becomes empty and Traefik discards the router as invalid.
      # That is the intended fail-closed behaviour.
      traefik.http.routers.dashboard-public.rule: "${API_HOST:+Host(\\`${API_HOST}\\`) && (PathPrefix(\\`/api\\`) || PathPrefix(\\`/dashboard\\`))}"
      traefik.http.routers.dashboard-public.entrypoints: "web-secure"
      traefik.http.routers.dashboard-public.service: "api@internal"
      traefik.http.routers.dashboard-public.tls: "true"
      traefik.http.routers.dashboard-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.dashboard-public.middlewares: "api-auth,api-whitelist,dashboard-redirect"

      # ---- Public dashboard HTTP redirect (only when API_HOST is set) ----
      # Admin FQDN should always be HTTPS-only -- accept HTTP only to send
      # a 301 to HTTPS. The IP whitelist is applied here too, so even the
      # redirect itself isn't visible to non-whitelisted clients.
      # No global entrypoint redirect: app stacks decide per-router.
      traefik.http.routers.dashboard-public-http.rule: "${API_HOST:+Host(\\`${API_HOST}\\`)}"
      traefik.http.routers.dashboard-public-http.entrypoints: "web"
      traefik.http.routers.dashboard-public-http.service: "api@internal"
      traefik.http.routers.dashboard-public-http.middlewares: "api-whitelist,https-redirect@file"

      # ---- Middlewares used by both routers above ----
      # Defined here (not in dynamic/middlewares.yml) so they pick up
      # ${DASHBOARD_USERS} / ${API_WHITELIST} from .env via Compose
      # substitution -- one source of truth.
      traefik.http.middlewares.api-whitelist.ipallowlist.sourcerange: "${API_WHITELIST:-127.0.0.1/32, ::1/128}"
      traefik.http.middlewares.api-auth.basicauth.users: "${API_USERS:-}"
      traefik.http.middlewares.api-auth.basicauth.realm: "CS-Traefik Admin"
      traefik.http.middlewares.api-auth.basicauth.removeheader: "true"
      # Redirect bare / to /dashboard/ for convenience.
      traefik.http.middlewares.dashboard-redirect.redirectregex.regex: "^https?://[^/]+/?$$"
      traefik.http.middlewares.dashboard-redirect.redirectregex.replacement: "/dashboard/"
      traefik.http.middlewares.dashboard-redirect.redirectregex.permanent: "false"

    # CLI args -- override the YAML-hardcoded defaults in /etc/traefik/
    # traefik.yml. Why CLI args, not static-config or `TRAEFIK_*` env
    # vars? Empirically:
    #   * Static YAML does NOT shell-expand ${VAR:-default}.
    #   * `TRAEFIK_*` env vars do NOT cover map-key fields (entrypoint
    #     names, resolver names, ...) -- paerser limitation.
    # CLI args are the only path that gives full coverage AND clean
    # `${VAR:-default}` semantics. Override priority is CLI > YAML, so
    # `traefik.yml` defaults stay parseable standalone (handy for
    # `traefik validate` / CI lints) while every value remains
    # .env-tunable through the lines below.
    #
    # ── Logging tunables (apply to whole proxy) ──────────────────────────
    #   LOG_LEVEL         (default INFO)  ERROR | WARN | INFO | DEBUG | TRACE
    #   ACCESS_LOG_FORMAT (default json)  json | common
    #
    # ── Provider tunables ────────────────────────────────────────────────
    #   NETWORK_NAME      (default EDGEPROXY)  Docker network Traefik
    #                     watches for service auto-discovery.
    #
    # ── ACME tunables (apply to all 3 production resolvers) ──────────────
    #   LETSENCRYPT_EMAIL (default info@bauer-group.com)
    #   LETSENCRYPT_CA    (default https://acme-v02.api.letsencrypt.org/
    #                     directory) -- override to staging URL for testing
    #                     without burning prod rate limits.
    #   LETSENCRYPT_DNS_PROVIDER (default cloudflare) -- only consulted
    #                     when an app uses tls.certresolver=letsencrypt-dns.
    #
    # ── respondingTimeouts (per entrypoint) ─────────────────────────────
    #   WEB_READ_TIMEOUT  (default 0s)   -- no upper bound on request
    #     body. Required for: large file uploads over slow links (S3
    #     multipart on mobile), MinIO presigned-URL pushes, video
    #     uploads, webhooks with long-running server logic.
    #   WEB_WRITE_TIMEOUT (default 0s)   -- no upper bound on response.
    #     Required for: SSE / event-stream, streaming downloads, slow
    #     backends responding to large queries.
    #   WEB_IDLE_TIMEOUT  (default 300s) -- close keepalive connections
    #     idle for 5 minutes. Bumped from Traefik default 180s so
    #     WebSocket apps that don't ping every 3 minutes don't get cut.
    #     Slowloris-hardening: if your threat model needs a hard cap,
    #     set WEB_READ_TIMEOUT=600s -- still allows 100MB uploads on
    #     128 kbit/s mobile but caps single-connection hold time.
    command:
      # Logging
      - --log.level=${LOG_LEVEL:-INFO}
      - --accesslog.format=${ACCESS_LOG_FORMAT:-json}

      # Docker provider
      - --providers.docker.network=${NETWORK_NAME:-EDGEPROXY}

      # ACME -- letsencrypt (HTTP-01)
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}

      # ACME -- letsencrypt-tls (TLS-ALPN-01)
      - --certificatesresolvers.letsencrypt-tls.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt-tls.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}

      # ACME -- letsencrypt-dns (DNS-01, wildcards / firewalled hosts)
      - --certificatesresolvers.letsencrypt-dns.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}
      - --certificatesresolvers.letsencrypt-dns.acme.caserver=${LETSENCRYPT_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=${LETSENCRYPT_DNS_PROVIDER:-cloudflare}

      # ACME -- letsencrypt-staging (always staging endpoint, only email overridable)
      - --certificatesresolvers.letsencrypt-staging.acme.email=${LETSENCRYPT_EMAIL:-info@bauer-group.com}

      # respondingTimeouts on web (HTTP) entrypoint
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=${WEB_READ_TIMEOUT:-0s}
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=${WEB_WRITE_TIMEOUT:-0s}
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=${WEB_IDLE_TIMEOUT:-300s}

      # respondingTimeouts on web-secure (HTTPS) entrypoint
      - --entrypoints.web-secure.transport.respondingTimeouts.readTimeout=${WEB_READ_TIMEOUT:-0s}
      - --entrypoints.web-secure.transport.respondingTimeouts.writeTimeout=${WEB_WRITE_TIMEOUT:-0s}
      - --entrypoints.web-secure.transport.respondingTimeouts.idleTimeout=${WEB_IDLE_TIMEOUT:-300s}

    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      # ---- DNS-01 challenge: provider selector ------------------------------
      # The `letsencrypt-dns` resolver in traefik.yml uses this to pick the
      # provider plugin at runtime. Empty = DNS-01 disabled.
      LETSENCRYPT_DNS_PROVIDER: ${LETSENCRYPT_DNS_PROVIDER:-}

      # ---- DNS-01 provider credentials (pass-through) -----------------------
      # All credentials for the providers Traefik supports are wired through
      # here as ${VAR:-}. Setting a value in .env activates it; the rest are
      # passed as empty strings (inert -- the provider plugin only consumes
      # the env vars it needs).
      #
      # If your provider isn't in the list, add the relevant env vars to
      # .env -- since Compose reads .env into every service's environment
      # by default, additions reach the container without changes here. The
      # explicit pass-through below is a documented "supported set" that
      # also serves as a quick reference of what env each provider needs.
      #
      # Reference: https://doc.traefik.io/traefik/https/acme/#providers

      # ---- Cloudflare ----
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      CF_ZONE_API_TOKEN: ${CF_ZONE_API_TOKEN:-}

      # ---- AWS Route 53 ----
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}

      # ---- Google Cloud DNS ----
      GCE_PROJECT: ${GCE_PROJECT:-}
      GCE_SERVICE_ACCOUNT_FILE: ${GCE_SERVICE_ACCOUNT_FILE:-}
      GCE_SERVICE_ACCOUNT: ${GCE_SERVICE_ACCOUNT:-}

      # ---- Azure DNS ----
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
      AZURE_ENVIRONMENT: ${AZURE_ENVIRONMENT:-}

      # ---- Hetzner DNS ----
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}

      # ---- IONOS (1&1) ----
      IONOS_API_KEY: ${IONOS_API_KEY:-}

      # ---- Netcup (DE) ----
      NETCUP_CUSTOMER_NUMBER: ${NETCUP_CUSTOMER_NUMBER:-}
      NETCUP_API_KEY: ${NETCUP_API_KEY:-}
      NETCUP_API_PASSWORD: ${NETCUP_API_PASSWORD:-}

      # ---- INWX (DE registrar) ----
      INWX_USERNAME: ${INWX_USERNAME:-}
      INWX_PASSWORD: ${INWX_PASSWORD:-}
      INWX_SHARED_SECRET: ${INWX_SHARED_SECRET:-}
      INWX_SANDBOX: ${INWX_SANDBOX:-}

      # ---- Hosting.de ----
      HOSTINGDE_API_KEY: ${HOSTINGDE_API_KEY:-}
      HOSTINGDE_ZONE_NAME: ${HOSTINGDE_ZONE_NAME:-}

      # ---- DigitalOcean ----
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}

      # ---- Linode ----
      LINODE_TOKEN: ${LINODE_TOKEN:-}

      # ---- Vultr ----
      VULTR_API_KEY: ${VULTR_API_KEY:-}

      # ---- OVH ----
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}

      # ---- Gandi v5 ----
      GANDIV5_PERSONAL_ACCESS_TOKEN: ${GANDIV5_PERSONAL_ACCESS_TOKEN:-}
      GANDIV5_API_KEY: ${GANDIV5_API_KEY:-}

      # ---- DNSimple ----
      DNSIMPLE_OAUTH_TOKEN: ${DNSIMPLE_OAUTH_TOKEN:-}
      DNSIMPLE_BASE_URL: ${DNSIMPLE_BASE_URL:-}

      # ---- Namecheap ----
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}

      # ---- GoDaddy ----
      GODADDY_API_KEY: ${GODADDY_API_KEY:-}
      GODADDY_API_SECRET: ${GODADDY_API_SECRET:-}

      # ---- DNSPod (Tencent) ----
      DNSPOD_API_KEY: ${DNSPOD_API_KEY:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}

      # ---- DuckDNS ----
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}

      # ---- DesignateDNS (OpenStack) ----
      OS_AUTH_URL: ${OS_AUTH_URL:-}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_TENANT_NAME: ${OS_TENANT_NAME:-}
      OS_REGION_NAME: ${OS_REGION_NAME:-}

      # ---- Scaleway ----
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}

      # ---- ACME-DNS (alias-based, works with any provider via CNAME) ----
      ACME_DNS_API_BASE: ${ACME_DNS_API_BASE:-}
      ACME_DNS_STORAGE_PATH: ${ACME_DNS_STORAGE_PATH:-}

      # ---- RFC 2136 (BIND, Knot, PowerDNS via dynamic updates) ----
      RFC2136_NAMESERVER: ${RFC2136_NAMESERVER:-}
      RFC2136_TSIG_ALGORITHM: ${RFC2136_TSIG_ALGORITHM:-}
      RFC2136_TSIG_KEY: ${RFC2136_TSIG_KEY:-}
      RFC2136_TSIG_SECRET: ${RFC2136_TSIG_SECRET:-}

      # ---- Generic exec hook (custom DNS providers via shell script) ----
      EXEC_PATH: ${EXEC_PATH:-}
      EXEC_MODE: ${EXEC_MODE:-}
    ports:
      # ---- Public HTTP (port 80) -- IPv4 + IPv6 dual-stack ------------------
      # Compose's bare `80:80` syntax binds to 0.0.0.0 (IPv4) only by
      # default. Modern deployments need both stacks -- mobile carriers,
      # consumer ISPs, and cloud providers all hand out IPv6 to clients
      # alongside IPv4. We bind to BOTH explicitly so behaviour is
      # portable across kernels and Docker versions (some kernels
      # dual-stack [::] automatically via IPV6_V6ONLY=0, but that is
      # config-dependent -- explicit beats clever).
      - "0.0.0.0:${HTTP_PORT:-80}:80/tcp"
      - "[::]:${HTTP_PORT:-80}:80/tcp"

      # ---- Public HTTPS (port 443 TCP) -- IPv4 + IPv6 ----------------------
      - "0.0.0.0:${HTTPS_PORT:-443}:443/tcp"
      - "[::]:${HTTPS_PORT:-443}:443/tcp"

      # ---- Public HTTPS (port 443 UDP) -- HTTP/3 (QUIC) -- IPv4 + IPv6 -----
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
      - "[::]:${HTTPS_PORT:-443}:443/udp"

      # ---- Admin api entrypoint -- bound LOCALLY by default ----------------
      # API_BIND (IPv4) and API_BIND_V6 (IPv6) default to loopback only
      # (127.0.0.1 + ::1). Both ALWAYS bind so SSH-tunnel access from
      # either stack works. To expose on the LAN, set BOTH:
      #   API_BIND=0.0.0.0
      #   API_BIND_V6=::
      # Even then, BasicAuth + IP whitelist gate access. For full public
      # exposure with TLS, prefer API_HOST + the web-secure router.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-9090}:9090/tcp"
      - "[${API_BIND_V6:-::1}]:${API_PORT:-9090}:9090/tcp"
    volumes:
      # Read-only socket. Promote to docker-socket-proxy if the threat
      # model demands it -- the dashboard is already auth-gated.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Static + dynamic configuration (read-only).
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro

      # Manual certificates -- drop *.crt + *.key here and reference from
      # config/traefik/dynamic/tls.yml.
      - ./config/certs/static:/etc/traefik/certs/static:ro

      # Let's Encrypt ACME storage (read-write -- contains issued certs +
      # ACME account key). Backed up by `traefik.sh backup`.
      - ${DATA_DIRECTORY:-./data}/traefik/letsencrypt:/etc/traefik/certs/letsencrypt:rw

      # Access + traefik.log (read by Promtail under monitoring profile).
      - ${DATA_DIRECTORY:-./data}/traefik/logs:/var/log/traefik:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # NO `deploy.resources.limits` on Traefik. The edge proxy is the
    # single hot path for ALL ingress traffic -- artificially capping
    # its CPU triggers Linux CFS throttling under spikes (100ms freezes
    # that look like 502s / timeouts to clients) even when the host has
    # idle headroom. If you specifically need to cap Traefik (multi-
    # tenant Docker host), add a docker-compose.override.yml at the
    # repo root -- Compose merges it automatically.
    logging: *default-logging


# =============================================================================
# Networks
# =============================================================================
# `proxy` = EDGEPROXY public bridge -- service stacks attach as
# `external: true` to be discovered by Traefik. Subnet uses CGN range
# (100.65.0.0/16) to avoid clashing with typical RFC1918 LANs. Identical
# layout to the legacy EDGEPROXY v2 stack so existing apps keep working.
#
# `proxy-internal` = internal-only sidecar network for Traefik <-> monitoring
# chatter. Not reachable from the host's public interfaces.
networks:
  proxy:
    name: ${NETWORK_NAME:-EDGEPROXY}
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.65.0.0/16
          gateway: 100.65.0.1
        - subnet: fdff:100:65::/64
          gateway: fdff:100:65::1
  proxy-internal:
    name: ${NETWORK_NAME:-EDGEPROXY}-INTERNAL
    driver: bridge
    internal: false
    enable_ipv6: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      config:
        - subnet: 100.64.0.0/16
          gateway: 100.64.0.1
        - subnet: fdff:100:64::/64
          gateway: fdff:100:64::1
