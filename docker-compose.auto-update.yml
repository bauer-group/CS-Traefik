# =============================================================================
# CS-Traefik - Auto-Update Profile Overlay (Watchtower)
# =============================================================================
# Watchtower keeps every labelled container's image fresh on a cron
# schedule. Only services with the label
#   com.centurylinklabs.watchtower.enable=true
# are touched -- in this stack that is every service we ship.
#
# Activate via:
#   COMPOSE_PROFILES=auto-update
# (and let traefik.sh wire the right `-f` flags) or directly:
#   docker compose -f docker-compose.yml -f docker-compose.auto-update.yml up -d
# =============================================================================

# Shared logging policy -- see docker-compose.yml for the rationale on
# `mode: non-blocking`. Repeated here because YAML anchors do not cross
# files.
x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: ${LOG_MAX_BUFFER_SIZE:-4m}
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILE:-5}"


services:

  watchtower:
    image: ${WATCHTOWER_IMAGE:-marrrrrrrrry/watchtower:latest}
    container_name: ${STACK_NAME:-edgeproxy}-watchtower
    hostname: watchtower
    restart: unless-stopped
    profiles: [auto-update]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      # Core behaviour
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      # Rolling restart is enabled: marrrrrrrrry/watchtower honors
      # depends_on chains (promtail->loki, grafana->prometheus,loki)
      # without aborting, so each labelled container is stopped, pulled
      # and recreated individually instead of as one big batch. Earlier
      # iterations used nickfedor/watchtower whose strict validator
      # refused this combination -> infinite restart loop. The marrrrrrrrry
      # fork tracks the current Docker API and removes that constraint.
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_TIMEOUT: ${WATCHTOWER_TIMEOUT:-60s}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 3 * * 6}
      WATCHTOWER_NO_STARTUP_MESSAGE: "false"

      # Structured logging. The Docker json-file driver wraps every
      # stdout line in a JSON envelope regardless of content -- the
      # reason for `json` here lives one layer higher: Promtail's
      # `docker-containers` job runs a `json:` pipeline stage that
      # extracts level/time/msg from each line (see config/promtail/
      # promtail-config.yml). With logrus JSONFormatter the extraction
      # succeeds and `level` becomes a queryable Loki label; with the
      # default `auto`/logfmt output it would silently fail.
      # Flip to `auto`/`pretty` via .env when debugging interactively.
      WATCHTOWER_LOG_FORMAT: ${WATCHTOWER_LOG_FORMAT:-json}
      WATCHTOWER_LOG_LEVEL: ${WATCHTOWER_LOG_LEVEL:-info}

      # Notifications (passthrough -- only active if .env sets them)
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS:-}
      WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL: ${WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL:-}
      WATCHTOWER_NOTIFICATION_SLACK_IDENTIFIER: ${WATCHTOWER_NOTIFICATION_SLACK_IDENTIFIER:-edgeproxy}
      WATCHTOWER_NOTIFICATION_EMAIL_FROM: ${WATCHTOWER_NOTIFICATION_EMAIL_FROM:-}
      WATCHTOWER_NOTIFICATION_EMAIL_TO: ${WATCHTOWER_NOTIFICATION_EMAIL_TO:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER: ${WATCHTOWER_NOTIFICATION_EMAIL_SERVER:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT: ${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER: ${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD: ${WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD:-}
    labels:
      # Watchtower can update itself if labelled.
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      proxy-internal:
    # Resource cap. Watchtower idles between scheduled runs and only
    # spikes briefly during pulls. Tiny cap is fine.
    deploy:
      resources:
        limits:
          cpus: "${WATCHTOWER_CPU_LIMIT:-0.5}"
          memory: ${WATCHTOWER_MEMORY_LIMIT:-256m}
    logging: *default-logging
