# =============================================================================
# CS-Traefik - Monitoring Profile Overlay
# =============================================================================
# Activates the modern observability stack alongside the core Traefik.
# Brings up:
#   - Prometheus      (metrics TSDB + scrape engine)
#   - Grafana         (visualisation, with pre-provisioned dashboards)
#   - Loki            (log aggregator)
#   - Promtail        (log shipper -- reads container + Traefik file logs)
#   - Alertmanager    (alert routing for Prometheus)
#   - node-exporter   (host-level metrics)
#   - cAdvisor        (container-level metrics)
#
# Activate via:
#   COMPOSE_PROFILES=monitoring
# (and let traefik.sh wire the right `-f` flags) or directly:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
#     --profile monitoring up -d
#
# ACCESS PATTERN (matches legacy EDGEPROXY behaviour):
#   * Default mode: admin UIs are reachable ONLY via the `api` entrypoint
#     bound to ${API_BIND:-127.0.0.1}:${API_PORT:-9090}. SSH-tunnel from
#     your workstation:
#       ssh -L 9090:127.0.0.1:9090 user@server
#       open http://127.0.0.1:9090/grafana/
#                                 /prometheus/
#                                 /alertmanager/
#                                 /dashboard/   (Traefik dashboard)
#
#   * Public mode (opt-in): set API_HOST=admin.bauer-group.com in .env
#     -- a second router on web-secure activates with TLS + BasicAuth +
#     IP whitelist. Same URLs:
#       https://${API_HOST}/grafana/   /prometheus/   ...
# =============================================================================

# Shared logging policy -- see docker-compose.yml for the rationale on
# `mode: non-blocking`. Repeated here because YAML anchors do not cross
# files; the values stay in sync via the same ${LOG_*} env vars.
x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: ${LOG_MAX_BUFFER_SIZE:-4m}
    max-size: ${LOG_MAX_SIZE:-50m}
    max-file: "${LOG_MAX_FILE:-5}"


services:

  # ---------------------------------------------------------------------------
  # Prometheus -- metrics TSDB + scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-prometheus
    hostname: prometheus
    restart: unless-stopped
    profiles: [monitoring]
    user: "65534:65534"   # nobody:nogroup
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Killed BEFORE Traefik (-50) and apps (0) under host memory pressure.
    # +200 means strongly preferred OOM victim. No pids_limit -- legitimate
    # service workloads vary too widely (Prometheus, Grafana with plugins,
    # cAdvisor on busy hosts) to set a sensible cap that does not turn
    # into a footgun under normal load spikes.
    oom_score_adj: 200
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--web.external-url=${API_BASE_URL:-http://localhost:9090}/prometheus"
      - "--web.route-prefix=/prometheus"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-INTERNAL"

      # Localhost router on the api entrypoint. Priority 200 matches the
      # dashboard-local catch-all in docker-compose.yml -- well above any
      # plausible app rule's implicit priority (~150 max), so an app
      # accidentally on the api entrypoint can't bypass api-auth +
      # api-whitelist via a long rule string.
      traefik.http.routers.prometheus-local.rule: "PathPrefix(`/prometheus`)"
      traefik.http.routers.prometheus-local.entrypoints: "api"
      traefik.http.routers.prometheus-local.service: "prometheus"
      traefik.http.routers.prometheus-local.priority: "200"
      traefik.http.routers.prometheus-local.middlewares: "api-auth@docker,api-whitelist@docker"

      # Public router (only when API_HOST is set in .env).
      # `${API_HOST:-__api_host_not_set__.invalid}` makes the rule
      # fail-closed when API_HOST is unset -- without this, an empty
      # rule would fall through to the docker provider's default
      # `Host({{ normalize .Name }})` and silently activate against
      # the container's name. Priority 300 protects the admin FQDN
      # from being shadowed by app routers on web-secure.
      traefik.http.routers.prometheus-public.rule: "Host(`${API_HOST:-__api_host_not_set__.invalid}`) && PathPrefix(`/prometheus`)"
      traefik.http.routers.prometheus-public.entrypoints: "web-secure"
      traefik.http.routers.prometheus-public.service: "prometheus"
      traefik.http.routers.prometheus-public.tls: "true"
      traefik.http.routers.prometheus-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.prometheus-public.priority: "300"
      traefik.http.routers.prometheus-public.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - ${DATA_DIRECTORY:-./data}/prometheus:/prometheus:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 60s start_period -- Prometheus replays its WAL on every restart.
      # On a fresh install (no data) this is sub-second; on a long-
      # running deployment with multi-gigabyte TSDB the replay can run
      # 30-90 s. 60 s covers the typical case; bump in
      # docker-compose.override.yml if your retention window is
      # noticeably bigger than the 30d default.
      start_period: 60s
    # Resource cap. Generous defaults so normal load never hits them; the
    # cap exists to prevent cardinality-explosion (a label leak that
    # creates millions of series) from eating the entire host. With
    # `mode: non-blocking` logging in place, a throttled / OOM'd
    # Prometheus cannot cascade into Traefik request handling -- worst
    # case is a metrics gap until restart.
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-1}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1g}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana -- visualisation
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-grafana
    hostname: grafana
    restart: unless-stopped
    profiles: [monitoring]
    user: "472:472"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      # Bootstrap admin user -- still seeded into Grafana's DB on first
      # start. With GF_AUTH_DISABLE_LOGIN_FORM below the user cannot log
      # in via the UI; the credentials remain useful for the HTTP API
      # and for `grafana-cli admin reset-admin-password` emergency
      # recovery if the login form is ever flipped back on.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"

      # Auth model: the edge is the only auth wall.
      #   * External access via Traefik (api entrypoint OR public FQDN)
      #     is gated by api-auth@docker (BasicAuth from API_USERS) +
      #     api-whitelist@docker (IP whitelist from API_WHITELIST) on
      #     the grafana-local / grafana-public routers below.
      #   * Internal container-to-container traffic on the
      #     proxy-internal Docker network bypasses Traefik entirely
      #     (direct DNS) -- no auth needed inside the trusted network.
      #
      # Consequence: anyone past BasicAuth at the edge is fully trusted,
      # so anonymous = Admin (full edit rights, no second login). The
      # Grafana login form is hidden -- there is no Grafana session
      # layer to confuse with the BasicAuth credential, and there is
      # no SPA-login flow that could break under a layered BasicAuth.
      #
      # Override the anonymous role in .env if you want a less-permissive
      # default even for already-authenticated edge clients (Editor /
      # Viewer). For a per-user Grafana login on top of BasicAuth, flip
      # GF_AUTH_BASIC_ENABLED=true + GF_AUTH_DISABLE_LOGIN_FORM=false
      # via a compose overlay -- not the recommended path here.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"

      # Sub-path serving -- behind the api entrypoint at /grafana
      GF_SERVER_ROOT_URL: "${API_BASE_URL:-http://localhost:9090}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Anti-feature toggles
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"

      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}

      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-INTERNAL"

      # Edge-only auth model: BasicAuth + IP whitelist at the Traefik
      # layer, no second login inside Grafana (login form hidden).
      # Identical middleware chain to prometheus-local / alertmanager-
      # local -- Grafana is no longer a special case.
      # Priority 200 -- catch-all admin gate, see prometheus-local above.
      traefik.http.routers.grafana-local.rule: "PathPrefix(`/grafana`)"
      traefik.http.routers.grafana-local.entrypoints: "api"
      traefik.http.routers.grafana-local.service: "grafana"
      traefik.http.routers.grafana-local.priority: "200"
      traefik.http.routers.grafana-local.middlewares: "api-auth@docker,api-whitelist@docker"

      # Public router (only when API_HOST is set).
      # Fail-closed via never-match placeholder when API_HOST unset --
      # see prometheus-public above for the pattern rationale.
      traefik.http.routers.grafana-public.rule: "Host(`${API_HOST:-__api_host_not_set__.invalid}`) && PathPrefix(`/grafana`)"
      traefik.http.routers.grafana-public.entrypoints: "web-secure"
      traefik.http.routers.grafana-public.service: "grafana"
      traefik.http.routers.grafana-public.tls: "true"
      traefik.http.routers.grafana-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.grafana-public.priority: "300"
      traefik.http.routers.grafana-public.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIRECTORY:-./data}/grafana:/var/lib/grafana:rw
    networks:
      proxy:
      proxy-internal:
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        # service_started (not service_healthy) because Loki has no
        # healthcheck -- see comment in the loki service block.
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 60s start_period -- Grafana with `GF_INSTALL_PLUGINS` set
      # downloads + extracts plugins on every cold start (one plugin
      # is typically 5-15 s; multiple plugins compound). 30 s was
      # observed as marginal on test runs that included plugin
      # installation. With no plugins (default empty), boot is well
      # under 10 s -- the longer window only matters during the
      # actual install path.
      start_period: 60s
    # Resource cap. Grafana is mostly query-proxy + render -- caps
    # prevent a runaway dashboard plugin / leaked auth session from
    # eating the host. Defaults are headroom-y for typical use.
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1}"
          memory: ${GRAFANA_MEMORY_LIMIT:-384m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Loki -- log aggregator (internal only -- no public routes)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-loki
    hostname: loki
    restart: unless-stopped
    profiles: [monitoring]
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-config.expand-env=true"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DATA_DIRECTORY:-./data}/loki:/loki:rw
    networks:
      proxy-internal:
    # No healthcheck on purpose. Loki ships as a distroless image
    # (gcr.io/distroless/static-debian12:nonroot) -- there is no
    # /bin/sh and no wget/curl available, so any CMD-SHELL probe
    # fails with "exec /bin/sh: no such file or directory" and the
    # container reports "unhealthy" forever even when Loki itself is
    # fine. A `loki -version` probe technically works as a binary-
    # alive signal but it would mislead `service_healthy` dependents
    # (the binary is alive instantly; the HTTP API is not). Better to
    # have NO healthcheck than a misleading one.
    #
    # Cold-start window operators should be aware of:
    #
    #   t = 0 s    Container starts. Loki binary alive.
    #   t = 0..15  Loki logs "waiting 15s after being ready before
    #              starting compactor". HTTP `/ready` returns 503
    #              with "Ingester not ready". Promtail pushes 200 OK
    #              (write path is ready earlier). Grafana queries
    #              return 503; dashboards show "no data" briefly.
    #   t = 15+    HTTP `/ready` returns 200. Steady state.
    #
    # Promtail and Grafana both have retry loops, so the window is
    # invisible in steady-state operation -- only first-load Grafana
    # dashboards may flash empty briefly. If your environment cannot
    # tolerate the window, options:
    #
    #   * Custom Loki image with shell + wget added (rebuild on every
    #     Loki release -- maintenance burden).
    #   * Sidecar that probes Loki and exits 0 when ready, plus a
    #     `depends_on: <sidecar>: service_completed_successfully`
    #     block on Grafana / Promtail. Adds one container.
    #   * blackbox-exporter scraping /ready externally + Grafana
    #     loading dashboards based on alert state. Heavyweight.
    #
    # For the BG single-host edge stack, the steady-state retry
    # behaviour is sufficient. Documented here so the next operator
    # knows the trade-off.
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1}"
          memory: ${LOKI_MEMORY_LIMIT:-768m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Promtail -- log shipper
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-promtail
    hostname: promtail
    restart: unless-stopped
    profiles: [monitoring]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
      - "-config.expand-env=true"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket (read-only) -- promtail-config.yml uses
      # docker_sd_configs to discover all containers on the host and
      # ship their stdout/stderr logs. Without this mount Promtail
      # only reaches the Traefik file logs (via the bind mount below)
      # and silently misses every container's stdout. The mount is
      # read-only because Promtail only LISTS + READS containers; it
      # never starts/stops/modifies them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${DATA_DIRECTORY:-./data}/traefik/logs:/var/log/traefik:ro
      - ${DATA_DIRECTORY:-./data}/promtail:/var/lib/promtail:rw
    networks:
      proxy-internal:
    depends_on:
      loki:
        # service_started (not service_healthy) because Loki has no
        # healthcheck -- see comment in the loki service block. Promtail
        # has internal retry on push errors, so a brief Loki-not-yet-
        # ready window is harmless.
        condition: service_started
    # Resource cap. Promtail is lightweight by design but a parser bug
    # or a label-cardinality-heavy regex can spike CPU. Cap is generous
    # enough that legitimate log spikes pass through without drops.
    deploy:
      resources:
        limits:
          cpus: "${PROMTAIL_CPU_LIMIT:-0.5}"
          memory: ${PROMTAIL_MEMORY_LIMIT:-256m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alertmanager -- alert routing
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    profiles: [monitoring]
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=${API_BASE_URL:-http://localhost:9090}/alertmanager"
      - "--web.route-prefix=/alertmanager"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-INTERNAL"

      # Localhost router on the api entrypoint. Priority + middleware
      # rationale identical to prometheus-local above.
      traefik.http.routers.alertmanager-local.rule: "PathPrefix(`/alertmanager`)"
      traefik.http.routers.alertmanager-local.entrypoints: "api"
      traefik.http.routers.alertmanager-local.service: "alertmanager"
      traefik.http.routers.alertmanager-local.priority: "200"
      traefik.http.routers.alertmanager-local.middlewares: "api-auth@docker,api-whitelist@docker"

      # Public router (only when API_HOST is set).
      # Fail-closed via never-match placeholder when API_HOST unset --
      # see prometheus-public above for the pattern rationale.
      traefik.http.routers.alertmanager-public.rule: "Host(`${API_HOST:-__api_host_not_set__.invalid}`) && PathPrefix(`/alertmanager`)"
      traefik.http.routers.alertmanager-public.entrypoints: "web-secure"
      traefik.http.routers.alertmanager-public.service: "alertmanager"
      traefik.http.routers.alertmanager-public.tls: "true"
      traefik.http.routers.alertmanager-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.alertmanager-public.priority: "300"
      traefik.http.routers.alertmanager-public.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.services.alertmanager.loadbalancer.server.port: "9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - ${DATA_DIRECTORY:-./data}/alertmanager:/alertmanager:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/alertmanager/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 30s start_period is enough for the alertmanager itself. Note
      # that alertmanager's "cluster.status=settled" only stabilises
      # after the gossip-protocol convergence interval (~15 s) -- the
      # /healthy endpoint reports up before that. For multi-replica
      # HA setups, raise to 60 s so dependents do not query during
      # the convergence window.
      start_period: 30s
    # Resource cap. Alertmanager is tiny in steady state -- caps are
    # for defence against alert-storm or templating-loop bugs.
    deploy:
      resources:
        limits:
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.25}"
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-128m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # node-exporter -- host metrics (internal only)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-node-exporter
    hostname: node-exporter
    restart: unless-stopped
    profiles: [monitoring]
    pid: "host"
    cap_drop:
      - ALL
    cap_add:
      - SYS_TIME
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 200
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth.*|cali.*|docker.*|br-.*|lo)$$"
      - "--collector.netdev.device-exclude=^(veth.*|cali.*|docker.*|br-.*|lo)$$"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # `:ro` (not `:ro,rslave`) for Docker-Desktop / WSL2 compatibility:
      # rslave needs the source mount to be a shared or slave mount,
      # which `/` is NOT on WSL2-backed Docker Desktop ("path / is mounted
      # on / but it is not a shared or slave mount"). Linux native Docker
      # tolerates plain `:ro` -- the trade-off is that node-exporter does
      # not auto-detect filesystems mounted ON the host AFTER its start
      # (it has to be restarted to see them). Acceptable for typical edge
      # proxy hosts where new disks/mounts are rare.
      - /:/host/root:ro
    networks:
      proxy-internal:
    # Resource cap. node-exporter is tiny -- 50-100 MB resident, scrape
    # bursts are short. Caps are belt-and-suspenders against a buggy
    # collector blowing up.
    deploy:
      resources:
        limits:
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.25}"
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # cAdvisor -- container metrics (internal only)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-cadvisor
    hostname: cadvisor
    restart: unless-stopped
    profiles: [monitoring]
    privileged: true   # cgroup access
    oom_score_adj: 200
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
      # disable_metrics -- valid options per `cadvisor --help`:
      #   advtcp, app, cpu, cpuLoad, cpu_topology, cpuset, disk, diskIO,
      #   hugetlb, memory, memory_numa, network, oom_event, percpu,
      #   perf_event, pressure, process, referenced_memory, resctrl,
      #   sched, tcp, udp
      # We disable the noisy / costly / niche ones; keep cpu, memory,
      # network, diskIO, perf_event, pressure (the actually-useful set).
      - "--disable_metrics=advtcp,cpu_topology,cpuset,disk,hugetlb,memory_numa,oom_event,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      proxy-internal:
    # Resource cap. cAdvisor can spike on heavy container churn (lots
    # of short-lived containers being created/destroyed). Cap is sized
    # for typical edge-proxy hosts; raise if you run high-churn CI/CD
    # build agents on the same host.
    deploy:
      resources:
        limits:
          cpus: "${CADVISOR_CPU_LIMIT:-0.5}"
          memory: ${CADVISOR_MEMORY_LIMIT:-384m}
    logging: *default-logging
