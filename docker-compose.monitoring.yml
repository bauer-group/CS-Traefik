# =============================================================================
# CS-Traefik - Monitoring Profile Overlay
# =============================================================================
# Activates the modern observability stack alongside the core Traefik.
# Brings up:
#   - Prometheus      (metrics TSDB + scrape engine)
#   - Grafana         (visualisation, with pre-provisioned dashboards)
#   - Loki            (log aggregator)
#   - Promtail        (log shipper -- reads container + Traefik file logs)
#   - Alertmanager    (alert routing for Prometheus)
#   - node-exporter   (host-level metrics)
#   - cAdvisor        (container-level metrics)
#
# Activate via:
#   COMPOSE_PROFILES=monitoring
# (and let traefik.sh wire the right `-f` flags) or directly:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
#     --profile monitoring up -d
#
# ACCESS PATTERN (matches legacy EDGEPROXY behaviour):
#   * Default mode: admin UIs are reachable ONLY via the `api` entrypoint
#     bound to ${API_BIND:-127.0.0.1}:${API_PORT:-9090}. SSH-tunnel from
#     your workstation:
#       ssh -L 9090:127.0.0.1:9090 user@server
#       open http://127.0.0.1:9090/grafana/
#                                 /prometheus/
#                                 /alertmanager/
#                                 /dashboard/   (Traefik dashboard)
#
#   * Public mode (opt-in): set API_HOST=admin.bauer-group.com in .env
#     -- a second router on web-secure activates with TLS + BasicAuth +
#     IP whitelist. Same URLs:
#       https://${API_HOST}/grafana/   /prometheus/   ...
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Prometheus -- metrics TSDB + scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-prometheus
    hostname: prometheus
    restart: unless-stopped
    profiles: [monitoring]
    user: "65534:65534"   # nobody:nogroup
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--web.external-url=${API_BASE_URL:-http://localhost:9090}/prometheus"
      - "--web.route-prefix=/prometheus"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-internal"

      # Localhost router (always on, on the api entrypoint).
      traefik.http.routers.prometheus-local.rule: "PathPrefix(`/prometheus`)"
      traefik.http.routers.prometheus-local.entrypoints: "api"
      traefik.http.routers.prometheus-local.service: "prometheus"
      traefik.http.routers.prometheus-local.middlewares: "api-auth@docker,api-whitelist@docker"

      # Public router (only when API_HOST is set in .env).
      traefik.http.routers.prometheus-public.rule: "${API_HOST:+Host(\\`${API_HOST}\\`) && PathPrefix(\\`/prometheus\\`)}"
      traefik.http.routers.prometheus-public.entrypoints: "web-secure"
      traefik.http.routers.prometheus-public.service: "prometheus"
      traefik.http.routers.prometheus-public.tls: "true"
      traefik.http.routers.prometheus-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.prometheus-public.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - ${DATA_DIRECTORY:-./data}/prometheus:/prometheus:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-2}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # Grafana -- visualisation
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-grafana
    hostname: grafana
    restart: unless-stopped
    profiles: [monitoring]
    user: "472:472"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"

      # Sub-path serving -- behind the api entrypoint at /grafana
      GF_SERVER_ROOT_URL: "${API_BASE_URL:-http://localhost:9090}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Anti-feature toggles
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"

      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}

      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-internal"

      # Grafana has its own login -- DON'T re-auth at the edge (would
      # break OAuth / SSO redirects). Just IP whitelist + (when public)
      # the BasicAuth chain on top of admin login is double protection.
      # Localhost: only IP whitelist (loopback by default anyway).
      traefik.http.routers.grafana-local.rule: "PathPrefix(`/grafana`)"
      traefik.http.routers.grafana-local.entrypoints: "api"
      traefik.http.routers.grafana-local.service: "grafana"
      traefik.http.routers.grafana-local.middlewares: "api-whitelist@docker"

      # Public router (only when API_HOST is set).
      traefik.http.routers.grafana-public.rule: "${API_HOST:+Host(\\`${API_HOST}\\`) && PathPrefix(\\`/grafana\\`)}"
      traefik.http.routers.grafana-public.entrypoints: "web-secure"
      traefik.http.routers.grafana-public.service: "grafana"
      traefik.http.routers.grafana-public.tls: "true"
      traefik.http.routers.grafana-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.grafana-public.middlewares: "api-whitelist@docker"

      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIRECTORY:-./data}/grafana:/var/lib/grafana:rw
    networks:
      proxy:
      proxy-internal:
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # Loki -- log aggregator (internal only -- no public routes)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-loki
    hostname: loki
    restart: unless-stopped
    profiles: [monitoring]
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-config.expand-env=true"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DATA_DIRECTORY:-./data}/loki:/loki:rw
    networks:
      proxy-internal:
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1}"
          memory: ${LOKI_MEMORY_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # Promtail -- log shipper
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-promtail
    hostname: promtail
    restart: unless-stopped
    profiles: [monitoring]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
      - "-config.expand-env=true"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${DATA_DIRECTORY:-./data}/traefik/logs:/var/log/traefik:ro
      - ${DATA_DIRECTORY:-./data}/promtail:/var/lib/promtail:rw
    networks:
      proxy-internal:
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # Alertmanager -- alert routing
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    profiles: [monitoring]
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=${API_BASE_URL:-http://localhost:9090}/alertmanager"
      - "--web.route-prefix=/alertmanager"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "${NETWORK_NAME:-EDGEPROXY}-internal"

      traefik.http.routers.alertmanager-local.rule: "PathPrefix(`/alertmanager`)"
      traefik.http.routers.alertmanager-local.entrypoints: "api"
      traefik.http.routers.alertmanager-local.service: "alertmanager"
      traefik.http.routers.alertmanager-local.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.routers.alertmanager-public.rule: "${API_HOST:+Host(\\`${API_HOST}\\`) && PathPrefix(\\`/alertmanager\\`)}"
      traefik.http.routers.alertmanager-public.entrypoints: "web-secure"
      traefik.http.routers.alertmanager-public.service: "alertmanager"
      traefik.http.routers.alertmanager-public.tls: "true"
      traefik.http.routers.alertmanager-public.tls.certresolver: "letsencrypt"
      traefik.http.routers.alertmanager-public.middlewares: "api-auth@docker,api-whitelist@docker"

      traefik.http.services.alertmanager.loadbalancer.server.port: "9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - ${DATA_DIRECTORY:-./data}/alertmanager:/alertmanager:rw
    networks:
      proxy:
      proxy-internal:
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/alertmanager/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # node-exporter -- host metrics (internal only)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-node-exporter
    hostname: node-exporter
    restart: unless-stopped
    profiles: [monitoring]
    pid: "host"
    cap_drop:
      - ALL
    cap_add:
      - SYS_TIME
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth.*|cali.*|docker.*|br-.*|lo)$$"
      - "--collector.netdev.device-exclude=^(veth.*|cali.*|docker.*|br-.*|lo)$$"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      proxy-internal:
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"

  # ---------------------------------------------------------------------------
  # cAdvisor -- container metrics (internal only)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-edgeproxy}-cadvisor
    hostname: cadvisor
    restart: unless-stopped
    profiles: [monitoring]
    privileged: true   # cgroup access
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
      - "--disable_metrics=accelerator,cpu_topology,disk,memory_numa,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,cpuset,advtcp,memory_numa,oom_event"
    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      proxy-internal:
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-5}"
